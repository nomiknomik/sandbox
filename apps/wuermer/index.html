<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Würmer">
<meta name="theme-color" content="#3FA34D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Würmer</title>
<style>
  /* Farben an einer Stelle */
  :root{--panel:rgba(20,32,48,.62);--text:#fff;--gruen:#2f8f3a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#7ec8f2}
  body{color:var(--text);font:16px/1.3 -apple-system,system-ui,sans-serif;
       -webkit-user-select:none;user-select:none;touch-action:none}
  canvas#bild{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* Oben: Teams, Zeit, Wind */
  #oben{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);display:flex;
        justify-content:center;gap:8px;pointer-events:none;padding:0 60px}
  .box{background:var(--panel);border-radius:14px;padding:6px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.35);box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .team{min-width:112px;border:2px solid transparent}
  .team.dran{border-color:#ffd84d}
  .team b{font-size:13px;display:block;white-space:nowrap}
  .bar{height:10px;border-radius:5px;background:#0004;overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
  #zeit{font-size:26px;font-weight:800;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
  #zeit.knapp{color:#ffb4b4}
  #wind{min-width:110px;text-align:center;font-size:12px}
  #windbar{position:relative;height:10px;border-radius:5px;background:#0004;margin-top:4px}
  #windbar i{position:absolute;top:0;height:100%;border-radius:5px;background:linear-gradient(90deg,#9be7ff,#fff)}
  #windbar:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:#fff8}
  #status{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 62px);transform:translateX(-50%);font-size:14px;
          pointer-events:none;white-space:nowrap}
  #status:empty{display:none}

  /* Unten: Steuerung und Waffen */
  #unten{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;
         justify-content:space-between;align-items:flex-end;padding:0 10px;pointer-events:none;gap:8px;transition:opacity .3s}
  #unten > div{display:flex;gap:8px;pointer-events:auto}
  #unten.aus{opacity:.3} #unten.aus > div{pointer-events:none}
  .knopf{width:62px;height:62px;border-radius:20px;border:3px solid rgba(255,255,255,.85);background:linear-gradient(rgba(70,95,125,.88),rgba(25,38,58,.9));color:#fff;font-size:28px;
         backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 5px 0 rgba(0,0,0,.35);text-shadow:0 2px 0 #0006}
  .knopf:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .waffe{position:relative;width:62px;height:62px;border-radius:20px;border:3px solid rgba(255,255,255,.55);background:linear-gradient(rgba(70,95,125,.85),rgba(25,38,58,.88));
         color:#fff;font-size:30px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 5px 0 rgba(0,0,0,.35)}
  .waffe:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .waffe.an{border-color:#ffd84d;background:linear-gradient(#a8801a,#5e430a);box-shadow:0 5px 0 #3d2b05,0 0 14px #ffd84d88}
  .waffe.leer{opacity:.35}
  .waffe small{position:absolute;right:4px;bottom:2px;font-size:12px;font-weight:700}
  #waffen{margin-right:56px;position:relative}
  #waffeninfo{position:absolute;right:0;bottom:72px;white-space:nowrap;font-size:14px;pointer-events:none}
  #waffeninfo:empty{display:none}
  .waffe.zu{opacity:.4}
  .waffe.zu:after{content:"🔒";position:absolute;left:3px;top:1px;font-size:12px}
  #runde{font-size:11px;text-align:center;min-width:74px}
  #runde b{display:block;font-size:14px;color:#ffd84d}
  #raus,#ton{position:fixed;top:calc(env(safe-area-inset-top) + 8px);width:46px;height:46px;font-size:20px}
  #raus{left:10px} #ton{right:10px}
  #uebersicht{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:62px;width:46px;height:46px;font-size:20px}
  #pause{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:114px;width:46px;height:46px;font-size:20px}
  #pausenbild{position:fixed;inset:0;z-index:50;background:rgba(10,20,40,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;cursor:pointer}
  #pausenbild b{font-size:64px;font-weight:900;text-shadow:0 4px 0 rgba(0,0,0,.35)}
  #pausenbild span{font-size:20px;font-weight:700}
  #direkt{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:62px;width:46px;height:46px;font-size:20px;background:#b8860b}

  /* Mitte: Ansage */
  #ansage{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;
          text-align:center;transition:opacity .35s,transform .35s;text-shadow:0 3px 0 #0005;width:90%}
  #ansage.zeigen{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #ansage b{display:block;font-size:46px;font-weight:900;letter-spacing:1px;
             text-shadow:3px 3px 0 #2b1a10,-3px 3px 0 #2b1a10,3px -3px 0 #2b1a10,-3px -3px 0 #2b1a10,0 4px 0 #2b1a10,0 8px 10px #0006}
  #ansage.zeigen b{animation:plopp .5s cubic-bezier(.3,1.7,.5,1)}
  #ansage span{font-size:17px;font-weight:700;text-shadow:2px 2px 0 #2b1a10,-2px 2px 0 #2b1a10,2px -2px 0 #2b1a10,-2px -2px 0 #2b1a10}
  @keyframes plopp{0%{transform:scale(.3)}100%{transform:scale(1)}}

  /* Menü-Karte (Start, Online, Ende) */
  #menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0003;overflow:auto;padding:16px}
  #karte{background:linear-gradient(#fffdf3,#eaf6dc);color:#1B2A3A;border-radius:30px;padding:24px 28px;text-align:center;border:5px solid #fff;
         width:100%;max-width:440px;box-shadow:0 8px 0 rgba(0,0,0,.18),0 18px 44px #0005;animation:plopp .35s cubic-bezier(.3,1.5,.5,1);max-height:100%;overflow:auto;-webkit-user-select:text;user-select:text}
  #karte h1{margin:0 0 4px;font-size:54px;font-weight:900;color:#ffd84d;letter-spacing:1px;
            text-shadow:3px 3px 0 #6b3d1e,-3px 3px 0 #6b3d1e,3px -3px 0 #6b3d1e,-3px -3px 0 #6b3d1e,0 6px 0 #6b3d1e,0 10px 12px #0004}
  #karte h2{margin:0 0 6px;color:#2f7a2c}
  #karte h3{margin:18px 0 6px;font-size:14px;color:#5b6b7c;text-align:left}
  #karte p{margin:8px 0 14px;color:#4a5a6a;white-space:pre-line}
  #karte .knoepfe{display:flex;flex-direction:column;gap:10px}
  #karte .reihe{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  #karte button{font:inherit;font-size:19px;font-weight:800;padding:13px 20px;border:3px solid #fff;border-radius:20px;
                background:linear-gradient(#7ad85a,#2f8f3a);color:#fff;box-shadow:0 5px 0 #1f6427,0 8px 14px #0003;text-shadow:0 2px 0 #1f6427}
  #karte button.gefahr{background:linear-gradient(#ff7676,#d32f2f);box-shadow:0 5px 0 #8e1b1b,0 8px 14px #0003;text-shadow:0 2px 0 #8e1b1b}
  #karte button.zweit{background:#e7edf3;color:#1B2A3A;box-shadow:0 4px 0 #b5c0cc;font-size:15px;padding:10px 14px;text-shadow:none}
  #karte button:active{transform:translateY(3px);box-shadow:none}
  #karte input,#karte textarea{width:100%;font:15px/1.3 ui-monospace,monospace;padding:10px;border:2px solid #cfd8e2;border-radius:12px;margin-bottom:8px}
  #karte textarea{height:60px;resize:none}
  #karte .fehler{color:#c62828}
  #karte canvas{width:min(70vw,46vh);max-width:300px;image-rendering:pixelated;border-radius:12px;border:4px solid #2f8f3a}
  #karte .wahl{display:flex;align-items:center;gap:6px;margin:8px 0;justify-content:space-between;flex-wrap:wrap}
  #karte .wahl b{min-width:80px;text-align:left}
  #karte .wahl span{display:flex;gap:6px}
  #karte .wahl button{font-size:14px;padding:8px 10px;background:#e7edf3;color:#1B2A3A;box-shadow:0 3px 0 #c5ced8}
  #karte .wahl button{text-shadow:none}
  #karte .wahl button.an{text-shadow:0 2px 0 #1f6427}
  #karte .wahl .zaehler{display:inline-flex;align-items:center;gap:2px;border:3px solid;border-radius:16px;padding:1px;background:#fff}
  #karte .wahl .zaehler button{padding:3px 9px;font-size:16px;box-shadow:none;border-radius:12px}
  #karte .wahl .zaehler b{min-width:18px;text-align:center}
  #karte .wahl button.farbknopf{width:44px;height:44px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #c5ced8,0 3px 6px rgba(0,0,0,.2);vertical-align:middle;margin-right:6px;overflow:hidden;position:relative;flex:none}
  #karte .wahl button.farbknopf img{position:absolute;left:50%;bottom:1px;height:36px;transform:translateX(-50%);filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
  #karte .wahl b{display:flex;align-items:center}
  .wurmicon{height:1.6em;vertical-align:middle;margin:-.3em .25em -.2em 0}
  #karte .wahl .zaehler{gap:4px}
  #karte .wahl .zaehler img{height:30px;margin:-4px 0 -2px}
  #karte .wahl button.an{background:linear-gradient(#5cc85a,#2f8f3a);color:#fff;box-shadow:0 3px 0 #1f6427}
  #fernbedienung{position:fixed;right:70px;bottom:calc(env(safe-area-inset-bottom) + 8px);
                 width:76px;height:76px;border-radius:50%;border:5px solid #fff;font-size:12px;background:radial-gradient(circle at 35% 30%,#ff7b7b,#d81f26 60%,#8e0f14);
                 color:#fff;font:800 15px -apple-system,system-ui,sans-serif;box-shadow:0 6px 0 #6b0b0f,0 10px 24px #0006;
                 display:flex;flex-direction:column;align-items:center;justify-content:center;animation:puls 1s infinite}
  #fernbedienung b{font-size:24px;line-height:1}
  #fernbedienung small{font-size:12px;opacity:.9}
  #fernbedienung:active{transform:translateY(4px);box-shadow:0 2px 0 #6b0b0f}
  @keyframes puls{50%{box-shadow:0 6px 0 #6b0b0f,0 0 0 10px #ff3b3b55}}
  @media (max-height:500px){#fernbedienung{width:60px;height:60px;font-size:10px;border-width:4px}#fernbedienung b{font-size:18px}}
  .versteckt{display:none!important}

  /* Kamera für den Einladungs-QR */
  #scanner{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
  #scanner.on{display:flex}
  #scanner video{width:min(80vw,60vh);aspect-ratio:1;object-fit:cover;border-radius:18px;border:4px solid #5cc85a}
  #scanner button{font:inherit;font-weight:800;padding:12px 26px;border:0;border-radius:14px;background:#fff;color:#000}

  #version{position:fixed;bottom:calc(2px + env(safe-area-inset-bottom));right:4px;padding:8px;font-size:12px;color:#fffc;cursor:pointer;text-shadow:0 1px 2px #0008;z-index:60}
  @media (max-height:500px){#waffeninfo{font-size:11px;bottom:56px;padding:4px 8px}#status{top:calc(env(safe-area-inset-top) + 56px);font-size:12px}}
  @media (max-width:760px){.team{min-width:76px}.team b{font-size:11px}#wind{min-width:80px}.knopf,.waffe{width:50px;height:50px;font-size:22px}}
</style>
</head>
<body>
<canvas id="bild"></canvas>

<div id="oben" class="versteckt"></div>
<div id="status" class="box versteckt"></div>
<button class="knopf versteckt" id="raus" aria-label="Spiel beenden">✕</button>
<button class="knopf versteckt" id="direkt" aria-label="WLAN-Direkt erlauben">⚡</button>
<button class="knopf versteckt" id="ton" aria-label="Ton an/aus">🔊</button>
<button class="knopf versteckt" id="uebersicht" aria-label="Übersicht">🔭</button>
<button class="knopf versteckt" id="pause" aria-label="Pause">⏸</button>
<div id="pausenbild" class="versteckt"><b>⏸ Pause</b><span>Antippen zum Weiterspielen</span></div>

<div id="unten" class="versteckt">
  <div>
    <button class="knopf" id="links">◀</button>
    <button class="knopf" id="springen">⤴</button>
    <button class="knopf" id="rechts">▶</button>
  </div>
  <div id="waffen">
    <button class="waffe an" data-w="bazooka">🚀</button>
    <button class="waffe" data-w="granate">💣</button>
    <button class="waffe" data-w="banane">🍌<small></small></button>
    <button class="waffe" data-w="schaf">🐑<small></small></button>
    <button class="waffe" data-w="luftschlag">✈️<small></small></button>
    <button class="waffe" data-w="dynamit">🧨<small></small></button>
    <button class="waffe" data-w="graben">⛏️<small></small></button>
    <button class="waffe" data-w="erdbrecher">🪨<small></small></button>
    <button class="waffe" data-w="trampolin"><svg viewBox="0 0 40 40" width="34" height="34" style="vertical-align:middle"><path d="M8 22 L4 35 M32 22 L36 35 M15 25 L13 35 M25 25 L27 35" stroke="#555" stroke-width="3" stroke-linecap="round"/><ellipse cx="20" cy="21" rx="17" ry="6" fill="#e33" stroke="#7a1010" stroke-width="2"/><ellipse cx="20" cy="20.5" rx="12.5" ry="3.6" fill="#1d2b44"/><path d="M20 4 l3 7 h-6z" fill="#ffd84d"/></svg><small></small></button>
    <button class="waffe" data-w="panzer"><svg viewBox="0 0 40 40" width="34" height="34" style="vertical-align:middle"><rect x="4" y="24" width="32" height="9" rx="4.5" fill="#333"/><circle cx="10" cy="28.5" r="2.5" fill="#888"/><circle cx="20" cy="28.5" r="2.5" fill="#888"/><circle cx="30" cy="28.5" r="2.5" fill="#888"/><path d="M6 24 L9 17 H31 L34 24Z" fill="#5b7a34" stroke="#2d3d18" stroke-width="1.5"/><path d="M14 17 Q14 10 20 10 Q26 10 26 17Z" fill="#6d8f40" stroke="#2d3d18" stroke-width="1.5"/><rect x="24" y="11.5" width="14" height="3.5" rx="1.5" fill="#3f5524"/></svg><small></small></button>
    <button class="waffe" data-w="teleport">🌀<small></small></button>
    <div id="waffeninfo" class="box"></div>
  </div>
</div>

<div id="ansage"><b></b><span></span></div>
<!-- Fernbedienung fürs Schaf -->
<button id="fernbedienung" class="versteckt"><b>💥</b>ZÜNDEN<small></small></button>

<div id="menu"><div id="karte"></div></div>

<div id="scanner">
  <video playsinline muted></video>
  <p id="sc-text">QR-Code der Einladung in den Rahmen halten</p>
  <button id="sc-stopp">Abbrechen</button>
</div>
<div id="version"></div>

<script>
// Bei jeder Änderung hochzählen (und CACHE in sw.js).
const APP_VERSION = '1.31';
// Version unten rechts antippen = nach Update suchen.
const versionEl = document.getElementById('version');
versionEl.textContent = 'v' + APP_VERSION;
versionEl.onclick = async () => {
  const zeig = (text, ms) => { versionEl.textContent = text; if (ms) setTimeout(() => versionEl.textContent = 'v' + APP_VERSION, ms); };
  zeig('suche Update …');
  try {
    const t = await (await fetch('index.html?u=' + Date.now(), { cache: 'no-store' })).text();
    const neu = (t.match(/APP_VERSION = '([^']+)'/) || [])[1];
    if (!neu || neu === APP_VERSION) return zeig('✓ aktuell (v' + APP_VERSION + ')', 2500);
    zeig('lade v' + neu + ' …');
    const reg = 'serviceWorker' in navigator && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update().catch(() => {});
    await new Promise(r => setTimeout(r, 1200));
    location.replace(location.pathname + '?v=' + encodeURIComponent(neu));
  } catch { zeig('offline – v' + APP_VERSION, 2500); }
};

const $ = id => document.getElementById(id);
const warte = ms => new Promise(r => setTimeout(r, ms));
// localStorage kann in privaten Fenstern fehlen – deshalb vorsichtig
const speicher = {
  lies(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  schreib(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  weg(k) { try { localStorage.removeItem(k); } catch {} },
};

// ================= Spielwelt =================
const W = 2000, H = 1100;      // so groß ist die Welt
const WASSER = H - 60;         // hier beginnt das Meer
const G = 620;                 // Schwerkraft
const R = 9;                   // Wurm-Radius
const MAX_V = 1100;            // stärkster Schuss (größer = weiter)
const TRAMPOLIN_V = 720;       // stärkster Trampolin-Sprung
const zugWeg = () => Math.max(80, Math.min(150, bh * .22));   // so weit ziehen (Bildschirmpunkte) = volle Kraft
const WIND_MAX = 160;
const ZUGZEIT = 45;            // Sekunden pro Zug
const SCHRITT = 1 / 60;        // die Welt rechnet 60-mal pro Sekunde

// Die Waffen – hier kann man Werte ändern!
//   sterne = wie stark, ab = ab welcher Runde es sie gibt, start = wie oft (fehlt = unendlich)
const WAFFEN = {
  bazooka:    { icon: '🚀', name: 'Bazooka',      sterne: 2, radius: 38, schaden: 40, ab: 1, info: 'Der Wind lenkt sie ab' },
  granate:    { icon: '💣', name: 'Granate',      sterne: 2, radius: 42, schaden: 45, ab: 1, zuender: 3, info: 'Hüpft – explodiert nach 3 Sekunden' },
  banane:     { icon: '🍌', name: 'Bananenbombe', sterne: 4, radius: 50, schaden: 40, ab: 2, zuender: 3, start: 1, info: 'Zerplatzt in 5 Mini-Bananen' },
  schaf:      { icon: '🐑', name: 'Schaf',        sterne: 3, radius: 62, schaden: 60, ab: 3, zuender: 10, start: 2, info: 'Läuft los – mit 💥 ZÜNDEN sprengst du es' },
  luftschlag: { icon: '✈️', name: 'Luftschlag',   sterne: 4, radius: 30, schaden: 26, ab: 4, start: 1, info: 'Tippe auf das Ziel!' },
  dynamit:    { icon: '🧨', name: 'Dynamit',      sterne: 5, radius: 80, schaden: 75, ab: 5, zuender: 5, start: 1, info: 'Hinlegen – und schnell weglaufen!' },
  graben:     { icon: '⛏️', name: 'Graben',       sterne: 0, ab: 1, info: 'In die Richtung ziehen, in die du graben willst – der Zug geht danach weiter' },
  erdbrecher: { icon: '🪨', name: 'Erdbrecher',   sterne: 0, radius: 55, schaden: 0, ab: 1, nurErde: true, info: 'Sprengt nur Erde weg – tut keinem Wurm weh' },
  trampolin:  { icon: '', name: 'Trampolin',    sterne: 0, ab: 1, start: 2, schaden: 10, info: 'Zielen wie mit der Bazooka – du fliegst selbst und wirfst andere Würmer um!' },
  panzer:     { icon: '', name: 'Panzer', sterne: 5, ab: 1, start: 0, nurKiste: true, schuesse: 3, info: 'Einsteigen! ◀ ▶ fahren, zielen wie immer – 3 Schüsse. Im Panzer nur halber Schaden.' },
  teleport:   { icon: '🌀', name: 'Teleporter',   sterne: 0, ab: 1, start: 0, nurKiste: true, info: 'Tippe, wohin du willst! – der Zug geht danach weiter' },
};
// Erfahrung: Jeder Sieg auf diesem Gerät zählt. Mit der Schwierigkeit (0–100) wird das Spiel
//   Schritt für Schritt wie das Original: weniger Kisten, Wind immer an, Schaf ohne Zünd-Knopf,
//   Trampolin wird schwächer und verschwindet. Online zählt das schwächste Gerät.
function meineSiege() { return speicher.lies('wu-siege') || 0; }
function meinSchwer() { const v = speicher.lies('wu-schwer'); return v == null ? Math.min(100, meineSiege()) : v; }
const AB = { wind: 25, schaf: 50, trampolinWeg: 80 };   // ab welcher Schwierigkeit
function regel() {
  const st = spiel ? spiel.schwer || 0 : 0;
  return { kisten: 1 - .75 * st / 100,                                        // Kisten fallen seltener
           windImmer: st >= AB.wind, schafKnopf: st < AB.schaf,
           trampolin: st >= AB.trampolinWeg ? 0 : 1 - .7 * st / AB.trampolinWeg }; // Trampolin immer kürzer, dann weg
}
// Kisten: wie oft sie pro Zug fallen (0.05 = 5 %)
const KISTEN = { apotheke: .06, bonus: .04, waffe: .4 };
const HEILUNG = 40;                      // so viele Leben gibt die Apotheke (höchstens bis 100)
// Unwetter: Chance pro 3 Züge, und bis zu so viele Blitze pro Zug
const UNWETTER = { chance: .25, blitze: 2, loch: 34 };
const MINI = { baenanchen: { radius: 28, schaden: 22 }, luftrakete: WAFFEN.luftschlag, panzergranate: { radius: 36, schaden: 38 } };
// Mit jeder Runde werden alle Waffen stärker (Schaden bis +60 %, Größe bis +25 %)
function rundeNr() { return spiel ? 1 + Math.floor(Math.max(0, spiel.zug) / spiel.n) : 1; }
function staerkeFaktor() { const r = rundeNr() - 1; return { d: Math.min(1.6, 1 + .1 * r), r: Math.min(1.25, 1 + .04 * r) }; }

// Teams (die Namen der Würmer stehen jetzt bei CHARAKTERE)
const TEAMS = [
  { name: 'Team Rot',  farbe: '#E5484D', hell: '#ffb3b5' },
  { name: 'Team Blau', farbe: '#3B82F6', hell: '#b3d0ff' },
  { name: 'Team Gelb', farbe: '#E8A317', hell: '#ffe08a' },
];
// Teamfarben zum Aussuchen (hell = Schrift auf dunklem Grund, balken = Lebensbalken)
const FARBEN = [
  { name: 'Rot',     farbe: '#E5484D', hell: '#ffb3b5' },
  { name: 'Blau',    farbe: '#3B82F6', hell: '#b3d0ff' },
  { name: 'Gelb',    farbe: '#E8A317', hell: '#ffe08a' },
  { name: 'Grün',    farbe: '#2FB344', hell: '#a6efb4' },
  { name: 'Lila',    farbe: '#8B5CF6', hell: '#d2c2ff' },
  { name: 'Orange',  farbe: '#F97316', hell: '#ffc59a' },
  { name: 'Pink',    farbe: '#EC4899', hell: '#ffb3d9' },
  { name: 'Türkis',  farbe: '#14B8A6', hell: '#9ff0e4' },
  { name: 'Schwarz', farbe: '#1f1f24', hell: '#e6e6ee', balken: '#8a8a96' },
];
function teamsSetzen(farben) {
  (farben || [0, 1, 2]).forEach((f, i) => { const F = FARBEN[f] || FARBEN[i]; Object.assign(TEAMS[i], { name: 'Team ' + F.name, farbe: F.farbe, hell: F.hell, balken: F.balken || F.farbe }); });
}

// Zufall mit „Startzahl“: Gleiche Startzahl = gleiche Zufallszahlen auf jedem Gerät.
// So sehen alle Geräte dieselbe Landschaft und denselben Wind.
function zufallsFolge(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
let zufall = zufallsFolge(1);
const zr = (a, b) => a + zufall() * (b - a);            // Zufall fürs Spiel (gleich auf allen Geräten)
const rnd = (a, b) => a + Math.random() * (b - a);      // Zufall nur fürs Aussehen (Funken, Rauch)

let maske, erde, ectx, wand;    // maske: 1 = Erde, 0 = Luft
let wuermer = [], dinge = [], teilchen = [], texte = [], graeber = [], wolken = [], kisten = [];
let spiel = null;               // Zustand eines laufenden Spiels
let zeit = 0, wackeln = 0;
const kam = { x: W / 2, y: H / 2, frei: false };

// ---------- Landschaft bauen ----------
function baueLandschaft(startzahl) {
  zufall = zufallsFolge(startzahl);
  const m = document.createElement('canvas'); m.width = W; m.height = H;
  const g = m.getContext('2d');
  const p = [zr(0, 7), zr(0, 7), zr(0, 7), zr(0, 7)];
  const tal = W * (0.45 + Math.sin(p[3]) * 0.1);
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W; x += 4) {
    const t = x / W * Math.PI * 2;
    let h = H * 0.6 + Math.sin(t * 1.3 + p[0]) * 120 + Math.sin(t * 3.1 + p[1]) * 60 + Math.sin(t * 7.7 + p[2]) * 18;
    const rand = Math.min(x, W - x);                   // an den Seiten ins Meer abfallen
    if (rand < 240) h += (240 - rand) * 1.8;
    if (Math.abs(x - tal) < 90) h += Math.cos((x - tal) / 90 * Math.PI / 2) * 160; // ein Tal
    g.lineTo(x, h);
  }
  g.lineTo(W, H); g.closePath(); g.fill();
  // schwebende Inseln
  for (let i = 0; i < 3; i++) {
    const x = zr(350, W - 350), y = zr(220, 380), b = zr(90, 160);
    g.beginPath(); g.ellipse(x, y, b, 26, 0, Math.PI, 0); g.ellipse(x, y, b, 55, 0, 0, Math.PI); g.fill();
  }
  // Rückwand: dunkle Erde, die man in Löchern und Höhlen sieht
  wand = document.createElement('canvas'); wand.width = W; wand.height = H;
  const wc = wand.getContext('2d');
  wc.fillStyle = '#4a2d18'; wc.fillRect(0, 0, W, H);
  for (let i = 0; i < 1500; i++) { wc.fillStyle = i % 2 ? '#3a2312' : '#5a3a22'; wc.beginPath(); wc.arc(rnd(0, W), rnd(150, H), rnd(2, 6), 0, 7); wc.fill(); }
  wc.globalCompositeOperation = 'destination-in'; wc.drawImage(m, 0, 0);
  // Höhlen
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 5; i++) {
    g.beginPath(); g.ellipse(zr(300, W - 300), zr(H * 0.72, H * 0.86), zr(40, 90), zr(25, 45), zr(-.4, .4), 0, 7); g.fill();
  }

  // Maske aus der Form lesen
  const d = g.getImageData(0, 0, W, H).data;
  maske = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) maske[i] = d[i * 4 + 3] > 128 ? 1 : 0;

  // Erde bemalen
  erde = document.createElement('canvas'); erde.width = W; erde.height = H;
  ectx = erde.getContext('2d');
  const v = ectx.createLinearGradient(0, 250, 0, H);
  v.addColorStop(0, '#a8713f'); v.addColorStop(.5, '#7b4c2a'); v.addColorStop(1, '#4b2c18');
  ectx.fillStyle = v; ectx.fillRect(0, 0, W, H);
  for (let y = 300; y < H; y += 26) {                 // Erdschichten
    ectx.strokeStyle = 'rgba(0,0,0,.07)'; ectx.lineWidth = 8; ectx.beginPath();
    for (let x = 0; x <= W; x += 20) ectx.lineTo(x, y + Math.sin(x * .01 + y) * 6);
    ectx.stroke();
  }
  for (let i = 0; i < 3500; i++) {                    // Steinchen
    const x = rnd(0, W), y = rnd(150, H), r = rnd(1.5, 6);
    ectx.fillStyle = ['#c9935d', '#5d3a20', '#9c6b43', '#d8b28a', '#6d4a33'][i % 5];
    ectx.globalAlpha = rnd(.3, .8);
    ectx.beginPath(); ectx.ellipse(x, y, r, r * rnd(.5, .9), rnd(0, 3), 0, 7); ectx.fill();
  }
  ectx.globalAlpha = 1;
  ectx.globalCompositeOperation = 'destination-in'; ectx.drawImage(m, 0, 0);
  ectx.globalCompositeOperation = 'source-over';
  // Licht und Schatten: oben hell, tiefer dunkler, Unterseiten (Überhänge) ganz dunkel
  const bild = ectx.getImageData(0, 0, W, H), px = bild.data, unten = new Int16Array(H);
  for (let x = 0; x < W; x++) {
    let u = 99; for (let y = H - 1; y >= 0; y--) { u = maske[y * W + x] ? Math.min(99, u + 1) : 0; unten[y] = u; }
    let tiefe = 0;
    for (let y = 0; y < H; y++) {
      const i = y * W + x;
      if (!maske[i]) { tiefe = 0; continue; }
      tiefe++;
      let f = 1.15 - Math.min(tiefe, 180) / 180 * .35;
      if (unten[y] < 10) f *= .6 + unten[y] * .04;
      if (unten[y] < 3 || (x > 2 && x < W - 3 && (!maske[i - 1] || !maske[i + 1] || !maske[i - 3] || !maske[i + 3]))) f *= .5;   // dunkler Rand
      px[i * 4] *= f; px[i * 4 + 1] *= f; px[i * 4 + 2] *= f;
    }
  }
  ectx.putImageData(bild, 0, 0);
  // Gras: überall, wo oben Luft und unten Erde ist
  for (let x = 0; x < W; x++) {
    for (let y = 1; y < H; y++) {
      if (maske[y * W + x] && !maske[(y - 1) * W + x]) {
        ectx.fillStyle = '#2f7a2c'; ectx.fillRect(x, y, 1, 11);
        ectx.fillStyle = '#4fae3f'; ectx.fillRect(x, y - 1, 1, 8);
        ectx.fillStyle = '#86d65a'; ectx.fillRect(x, y - 1, 1, 3);
        if (Math.random() < .35) {
          ectx.strokeStyle = Math.random() < .5 ? '#5fbf45' : '#3e9a36'; ectx.lineWidth = 1.3;
          ectx.beginPath(); ectx.moveTo(x, y + 1); ectx.lineTo(x + rnd(-2.5, 2.5), y - rnd(3, 9)); ectx.stroke();
        }
        if (Math.random() < .006) blume(x, y);
      }
    }
  }
}
function blume(x, y) {
  ectx.strokeStyle = '#3e9a36'; ectx.lineWidth = 1.5;
  ectx.beginPath(); ectx.moveTo(x, y); ectx.lineTo(x, y - 10); ectx.stroke();
  ectx.fillStyle = ['#ffd84d', '#ff8fb1', '#ffffff', '#b28dff'][Math.random() * 4 | 0];
  for (let i = 0; i < 5; i++) { ectx.beginPath(); ectx.arc(x + Math.cos(i * 1.26) * 2.6, y - 10 + Math.sin(i * 1.26) * 2.6, 2, 0, 7); ectx.fill(); }
  ectx.fillStyle = '#e8a321'; ectx.beginPath(); ectx.arc(x, y - 10, 1.5, 0, 7); ectx.fill();
}

// Loch in die Erde sprengen
function loch(x, y, r) {
  ectx.globalCompositeOperation = 'destination-out';
  ectx.beginPath(); ectx.arc(x, y, r, 0, 7); ectx.fill();
  ectx.globalCompositeOperation = 'source-atop';      // verbrannter Rand
  ectx.strokeStyle = 'rgba(45,22,10,.6)'; ectx.lineWidth = 7;
  ectx.beginPath(); ectx.arc(x, y, r + 2, 0, 7); ectx.stroke();
  ectx.globalCompositeOperation = 'source-over';
  for (let yy = Math.max(0, y - r | 0); yy <= Math.min(H - 1, y + r); yy++)
    for (let xx = Math.max(0, x - r | 0); xx <= Math.min(W - 1, x + r); xx++)
      if ((xx - x) ** 2 + (yy - y) ** 2 <= r * r) maske[yy * W + xx] = 0;
}

// ---------- Physik ----------
function fest(x, y) { x |= 0; y |= 0; if (x < 0 || x >= W || y < 0) return false; if (y >= H) return true; return maske[y * W + x] === 1; }
const RING = [...Array(16)].map((_, i) => [Math.cos(i * Math.PI / 8), Math.sin(i * Math.PI / 8)]);
function stoesst(x, y, r) { if (fest(x, y)) return true; for (const [c, s] of RING) if (fest(x + c * r, y + s * r)) return true; return false; }
function normale(x, y, r) {
  let nx = 0, ny = 0;
  for (const [c, s] of RING) if (fest(x + c * (r + 1.5), y + s * (r + 1.5))) { nx -= c; ny -= s; }
  const l = Math.hypot(nx, ny); return l ? [nx / l, ny / l] : [0, -1];
}
// Bewegen in kleinen Schritten; beiAufprall entscheidet, was passiert
function bewege(o, dt, beiAufprall) {
  const n = Math.max(1, Math.ceil(Math.hypot(o.vx, o.vy) * dt / 2));
  for (let i = 0; i < n; i++) {
    const nx = o.x + o.vx * dt / n, ny = o.y + o.vy * dt / n;
    if (stoesst(nx, ny, o.r)) { const [ax, ay] = normale(nx, ny, o.r); beiAufprall(o, ax, ay); return true; }
    o.x = nx; o.y = ny;
  }
  return false;
}
function abprallen(o, ax, ay, e, reib) {
  const vn = o.vx * ax + o.vy * ay;
  if (vn < 0) { o.vx -= (1 + e) * vn * ax; o.vy -= (1 + e) * vn * ay; o.vx *= reib; o.vy *= reib; }
  else { o.x += ax; o.y += ay; }
  return -vn;
}
// einen Pixel zur Seite laufen (klettert kleine Stufen)
function schritt(o, d, klettern = 9) {
  const nx = o.x + d;
  if (!stoesst(nx, o.y, o.r)) {
    for (let k = 1; k <= klettern; k++) if (stoesst(nx, o.y + k, o.r)) { o.x = nx; o.y += k - 1; return true; }
    o.x = nx; o.luft = true; o.vx = d * 40; o.vy = 0; return true;
  }
  for (let k = 1; k <= klettern; k++) if (!stoesst(nx, o.y - k, o.r)) { o.x = nx; o.y -= k; return true; }
  return false;
}
function freiMachen(o) { if (stoesst(o.x, o.y, o.r)) for (let k = 1; k < 30; k++) if (!stoesst(o.x, o.y - k, o.r)) { o.y -= k; break; } }

// ---------- Würmer ----------
function neuerWurm(team) {
  const nr = wuermer.length, name = CHARAKTERE[nr % CHARAKTERE.length].name + ['', ' II', ' III'][Math.min(2, Math.floor(nr / CHARAKTERE.length))];
  let x, y, ok = false;
  for (let v = 0; v < 400 && !ok; v++) {
    x = Math.round(zr(120, W - 120));
    for (y = 0; y < WASSER; y += 2) if (stoesst(x, y, R)) break;
    y -= 2;
    ok = y < WASSER - 60 && y > 40 && wuermer.every(w => Math.hypot(w.x - x, w.y - y) > (wuermer.length > 20 ? 55 : wuermer.length > 11 ? 75 : 100));
  }
  return { team, name, x, y, vx: 0, vy: 0, r: R, hp: 100, luft: true, tot: false, richtung: zr(0, 1) < .5 ? 1 : -1,
           ziel: -0.6, laufen: 0, schritte: 0, dreh: 0, blinzeln: rnd(1, 4), samen: rnd(0, 9), aua: 0,
           typ: wuermer.length % CHARAKTERE.length };   // welcher Charakter: der Reihe nach, bei mehr als 12 von vorn
}

function aktiver() { return spiel && spiel.wurm; }

function schaden(w, n) {
  if (w.tot || n <= 0) return;
  if (w.panzer) n = Math.ceil(n / 2);                  // Panzer schützt
  w.hp = Math.max(0, w.hp - n); w.aua = 1; w.auaBis = zeit + 1.3;
  if (w.hp > 0) sag(w, 'aua'); else sag(w, 'tschuess', true);
  if (spiel && aktiver() && w.team !== aktiver().team) spiel.trafGegner = true;
  const a = spiel && aktiver();
  if (a && a !== w && a.team !== w.team && !a.tot && !(spiel.gesagt === spiel.zug)) { spiel.gesagt = spiel.zug; setTimeout(() => { sag(a, 'treffer'); a.jubelBis = zeit + 2.2; }, 900); }
  texte.push({ x: w.x, y: w.y - 30, t: 0, text: '-' + n, farbe: TEAMS[w.team].farbe });
  if (w === aktiver() && (spiel.phase === 'zielen' || spiel.phase === 'rueckzug')) spiel.phase = 'warten';
}

function updateWurm(w, dt) {
  if (w.tot) return;
  w.aua = Math.max(0, w.aua - dt * 2);
  w.quetsch = Math.max(0, (w.quetsch || 0) - dt * 3.5);   // nur fürs Aussehen
  w.blinzeln -= dt; if (w.blinzeln < -0.15) w.blinzeln = rnd(2, 5);
  if (w.luft) {
    freiMachen(w);
    w.vy += G * dt;
    w.dreh += w.vx * dt * 0.05;
    w.flugZeit = (w.flugZeit || 0) + dt;
    if (w.weich) for (const o of wuermer) {                // Trampolin-Flug: andere Würmer umwerfen
      if (o === w || o.tot || (w.umgeworfen || []).includes(o) || Math.hypot(o.x - w.x, o.y - w.y) > R * 2 + 2) continue;
      (w.umgeworfen = w.umgeworfen || []).push(o);
      o.vx += w.vx * .7; o.vy = Math.min(o.vy, -220) + w.vy * .3; o.luft = true; o.y -= 2;
      schaden(o, WAFFEN.trampolin.schaden); w.vx *= .5;
      teilchen.push({ art: 'ring', x: o.x, y: o.y, r: 4, gross: 24, t: 0, max: .3 }); ton.klack();
    }
    bewege(w, dt, (o, ax, ay) => {
      const wucht = abprallen(o, ax, ay, 0.25, 0.65);
      if (wucht > 480 && !o.weich) schaden(o, Math.round((wucht - 480) / 9));   // weich = Trampolin-Flug, tut nicht weh
      if (o.weich && o.flugZeit < .15) return;           // Trampolin: kurz nach dem Abheben noch nicht landen
      if ((ay < -0.6 && wucht < 280) || Math.hypot(o.vx, o.vy) < 35) { o.vx = o.vy = 0; o.luft = false; o.dreh = 0; o.doppel = false; o.weich = false; o.umgeworfen = null; o.quetsch = Math.min(1, .3 + wucht / 300); }
    });
  } else if (!stoesst(w.x, w.y + 1, R)) { w.luft = true; w.vx = w.vy = 0; }
  if (w.y > WASSER + 8) ertrinken(w);
}
function ertrinken(w) {
  sag(w, 'blubb', true);
  w.tot = true; w.hp = 0; w.ertrunken = true;
  platsch(w.x); ton.platsch();
  texte.push({ x: w.x, y: WASSER - 30, t: 0, text: 'Blubb!', farbe: '#fff' });
}
function laufen(w, d, dt) {
  w.laufen += 55 * dt; w.schritte += dt;
  while (w.laufen >= 1) { w.laufen -= 1; if (!schritt(w, d)) { w.laufen = 0; break; } if (w.luft) break; }
}
// Springen: höher als früher; mit ◀/▶ gedrückt weiter nach vorne; in der Luft nochmal = Doppelsprung
function springen(w, vor) {
  if (!w.luft) { w.vy = -330; w.vx = w.richtung * (vor ? 190 : 110); w.luft = true; w.y -= 2; w.doppel = true; ton.boing(); }
  else if (w.doppel) { w.doppel = false; w.vy = -310; w.vx = w.richtung * 150; ton.boing(); }
}

// ---------- Explosion ----------
function explosion(x, y, r, dmg, nurErde) {
  loch(x, y, r);
  if (spiel) spiel.krater.push([x, y, r]);            // merken – für den Abgleich mit anderen Geräten
  if (nurErde) {                                      // Erdbrecher: nur Erdbrocken und Staub, sonst nichts
    ton.klack(); wackeln = Math.max(wackeln, r * .15);
    for (let i = 0; i < 30; i++) { const a = rnd(0, 7), sp = rnd(100, 380); teilchen.push({ art: 'brocken', x: x + Math.cos(a) * r * .5, y: y + Math.sin(a) * r * .5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, t: 0, max: rnd(.8, 1.5), r: rnd(1.5, 4), farbe: ['#7b4c2a', '#a8713f', '#5d3a20'][i % 3] }); }
    for (let i = 0; i < 10; i++) teilchen.push({ art: 'rauch', x: x + rnd(-r, r) * .6, y: y + rnd(-r, r) * .6, vx: rnd(-40, 40), vy: rnd(-50, -10), t: 0, max: rnd(.8, 1.5), r: rnd(8, 14) });
    return;
  }
  ton.bumm(r);
  wackeln = Math.max(wackeln, r * 0.35);
  teilchen.push({ art: 'ring', x, y, r: r * 0.4, gross: r * 1.5, t: 0, max: .5 });
  teilchen.push({ art: 'blitz', x, y, r: r * 1.6, t: 0 });
  teilchen.push({ art: 'feuerball', x, y, r: r * 1.15, t: 0, max: .5 });
  for (let i = 0; i < 7; i++) { const a = rnd(0, 7), d = r * rnd(.3, .8); teilchen.push({ art: 'puff', x: x + Math.cos(a) * d, y: y + Math.sin(a) * d, vx: Math.cos(a) * 40, vy: Math.sin(a) * 40 - 30, t: 0, max: rnd(.7, 1.1), r: r * rnd(.25, .4) }); }
  for (let i = 0; i < 6; i++) { const a = rnd(0, 7), s = rnd(150, 320); teilchen.push({ art: 'stern', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 140, t: 0, max: 1, r: rnd(4, 7), dreh: rnd(0, 6) }); }
  for (let i = 0; i < 16; i++) { const a = rnd(0, 7), s = rnd(250, 600); teilchen.push({ art: 'funke', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 100, t: 0, max: rnd(.3, .6) }); }
  for (let i = 0; i < 22; i++) { const a = rnd(0, 7), s = rnd(40, 260); teilchen.push({ art: 'feuer', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, t: 0, max: rnd(.3, .7), r: rnd(5, 11) }); }
  for (let i = 0; i < 14; i++) { const a = rnd(0, 7), s = rnd(10, 90); teilchen.push({ art: 'rauch', x: x + rnd(-r, r) * .5, y: y + rnd(-r, r) * .5, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, t: 0, max: rnd(1, 2), r: rnd(8, 16) }); }
  for (let i = 0; i < 26; i++) { const a = rnd(Math.PI, Math.PI * 2), s = rnd(150, 450); teilchen.push({ art: 'brocken', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, max: rnd(.8, 1.6), r: rnd(1.5, 4), farbe: ['#7b4c2a', '#a8713f', '#4fae3f', '#5d3a20'][i % 4] }); }
  for (const k of kisten) if (Math.hypot(k.x - x, k.y - y) < r + 10) {        // Kiste zerplatzt
    k.weg = true;
    for (let i = 0; i < 10; i++) teilchen.push({ art: 'brocken', x: k.x, y: k.y, vx: rnd(-200, 200), vy: rnd(-350, -100), t: 0, max: 1.2, r: rnd(2, 4), farbe: i % 2 ? '#b07a3e' : '#8a5a2b' });
  }
  kisten = kisten.filter(k => !k.weg);
  // Würmer und Dinge wegschleudern
  for (const o of [...wuermer, ...dinge]) {
    if (o.tot) continue;
    const dx = o.x - x, dy = o.y - y - 6, d = Math.hypot(dx, dy);
    if (d > r + 16) continue;
    const f = 1 - d / (r + 16), l = d || 1, k = 120 + f * 420;
    o.vx += dx / l * k; o.vy += dy / l * k - 80 * f; o.luft = true; o.ruhe = false;

// Trifft etwas (Mitte x/y, Radius r) den Wurm? Zwei Kreise: Körper unten und der große Kopf oben
function trifftWurm(w, x, y, r) {
  return Math.hypot(w.x - x, w.y - y) < R + r + 2 ||
         Math.hypot(w.x + w.richtung * 4 - x, w.y - 24 - y) < 11 + r;
}

// ---------- Blitz (nur bei Unwetter) ----------
function blitz(x) {

function updateDing(o, dt) {
  o.t += dt;

    o.dreh = Math.atan2(o.vy, o.vx);

    if (o.art === 'baenanchen' || o.art === 'erdbrecher') o.dreh = o.t * 12;
    if (bewege(o, dt, () => {})) return platzen(o);
    if (o.art === 'erdbrecher') return o.y > WASSER + 5 ? (platsch(o.x), false) : o.x > -400 && o.x < W + 400;   // fliegt durch Würmer durch
    for (const w of wuermer) if (!w.tot && !(w === o.besitzer && o.t < .25) && trifftWurm(w, o.x, o.y, o.r)) return platzen(o);

    if (!o.ruhe) {

        const wucht = abprallen(o, ax, ay, o.art === 'granate' ? .5 : o.art === 'dynamit' ? .1 : .45, o.art === 'dynamit' ? .5 : .8);
        if (wucht > 60) ton.klack();

function platzen(o) {

    for (let i = 0; i < 5; i++) dinge.push({ art: 'baenanchen', x: o.x, y: o.y - 4, vx: zr(-240, 240), vy: zr(-520, -320), r: 4, t: 0, dreh: 0 });

// ---------- Teilchen ----------
function platsch(x) {
  for (let i = 0; i < 24; i++) teilchen.push({ art: 'tropfen', x: x + rnd(-10, 10), y: WASSER, vx: rnd(-120, 120), vy: rnd(-380, -120), t: 0, max: 1.2, r: rnd(2, 4) });
}
function updateTeilchen(dt) {
  for (const p of teilchen) {
    p.t += dt;
    if (p.vx !== undefined) { p.x += p.vx * dt; p.y += p.vy * dt; }
  if (p.art === 'brocken' || p.art === 'tropfen' || p.art === 'konfetti' || p.art === 'funke' || p.art === 'stern') p.vy += G * dt;

// ================= Spielablauf =================
// Ein Zug wird als Liste von Eingaben aufgeschrieben: [Art, Bild-Nummer, Werte …]

function neuesSpiel({ n, startzahl, modus = 'lokal', ich = -1, id = null, art = null, stufe = 'mittel', host = false, mitWind = true, anzahl = null, schwer = 0 }) {
  mitWind = mitWind || schwer >= AB.wind;              // ab dieser Stufe ist der Wind immer an
  baueLandschaft(startzahl);
  wuermer = []; dinge = []; teilchen = []; texte = []; graeber = []; kisten = [];
  spiel = { n, startzahl, modus, ich, id, art: art || Array(n).fill('m'), stufe, host, mitWind, schwer, anzahl: anzahl || Array(n).fill(4), zug: -1, dran: 0, wurm: null, phase: 'warten', zugzeit: ZUGZEIT,
            rueckzug: 0, warte: 0, wind: 0, waffe: 'bazooka', erster: true, bild: 0, ein: {}, eingaben: [], log: [],
            krater: [], quelle: 'live', zuege: [], ausstehend: [],

  for (let i = 0; i < 240; i++) for (const w of wuermer) updateWurm(w, SCHRITT);

  spiel.dran = (spiel.dran + n - 1) % n;
  spiel.krater = [];

  ['oben', 'unten', 'ton', 'raus', 'status', 'uebersicht'].forEach(id => $(id).classList.remove('versteckt'));
  $('pause').classList.toggle('versteckt', modus !== 'lokal');   // Pause nur auf einem Gerät (online laufen die anderen weiter)
  $('menu').classList.add('versteckt');

}

function lebt(t) { return wuermer.some(w => w.team === t && !w.tot); }

// Spur des letzten Schusses merken (wie bei Angry Birds) – nur fürs Aussehen
function spurMerken() {
  if (!spiel || spiel.fertig || spiel.phase !== 'flug' || !dinge.length) return;

  let kiste = '';

  if (spiel.zug > 0 && wurf < K.apotheke) { kisten.push({ x: kx, y: -60, art: 'apotheke', r: 9, luft: true }); kiste = '  ❤️ Apotheke!'; }
  else if (spiel.zug > 0 && wurf < K.apotheke + K.bonus) { kisten.push({ x: kx, y: -60, art: 'bonus', r: 9, luft: true }); kiste = '  🎁 Bonus-Kiste!'; }

    let art = arten.length && arten[Math.floor(zr(0, arten.length))];

    neu = `\n⚡ Runde ${nr}: Waffen +${Math.round((staerkeFaktor().d - 1) * 100)} %` + (frei.length ? ' · Neu: ' + frei.join(', ') : '');

// Der Zug ist vorbei: online abschicken oder abgleichen, dann weiter

  const figur = WURM_BILDER[(w.typ || 0) % WURM_BILDER.length];

  if (!b.img.complete || !b.img.naturalWidth) { b = figur.normal; variante = 'normal'; }
  if (!b.img.complete || !b.img.naturalWidth) return null;

    const g = c.getContext('2d'); g.drawImage(b.img, 0, 0);

    const tr = parseInt(farbe.slice(1, 3), 16), tg = parseInt(farbe.slice(3, 5), 16), tb = parseInt(farbe.slice(5, 7), 16);

function zeichneZielhilfe(w) {
  const staerke = zielt ? zielt.staerke : spiel.ladung || 0;
  const cx = w.x + Math.cos(w.ziel) * 16, cy = w.y - 4 + Math.sin(w.ziel) * 16;
  // Fadenkreuz
  const fx = w.x + Math.cos(w.ziel) * 55, fy = w.y - 4 + Math.sin(w.ziel) * 55;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(fx, fy, 6, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#e33'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(fx, fy, 6, 0, 7); ctx.moveTo(fx - 9, fy); ctx.lineTo(fx + 9, fy); ctx.moveTo(fx, fy - 9); ctx.lineTo(fx, fy + 9); ctx.stroke();

    let x = cx, y = cy, vx = Math.cos(w.ziel) * v, vy = Math.sin(w.ziel) * v;

    for (let i = 0; i < PUNKTE; i++) {
      for (let j = 0; j < 2; j++) { vy += G / 60; x += vx / 60; y += vy / 60; }
      ctx.fillStyle = `rgba(255,255,255,${.9 - i / PUNKTE * .6})`; ctx.beginPath(); ctx.arc(x, y, 3 - i / PUNKTE * 1.5, 0, 7); ctx.fill();
    }

  // Kraft-Balken als bunter Fächer
  for (let i = 0; i < 12 * staerke; i++) {
    const d = 18 + i * 4;
    ctx.fillStyle = `hsl(${60 - i * 5},100%,55%)`;
    ctx.beginPath(); ctx.arc(w.x + Math.cos(w.ziel) * d, w.y - 4 + Math.sin(w.ziel) * d, 1.5 + i * .35, 0, 7); ctx.fill();

}
// Die Steinschleuder unter dem Finger (in Bildschirm-Punkten)

function zeichne() {

  welle(WASSER - 14, '#3b8fc9', 5, 2, links, rechts, unten);
  ctx.drawImage(wand, 0, 0);

    ctx.lineWidth = 8; ctx.strokeStyle = '#2b1a10'; ctx.strokeText(t.text, 0, 0);

    ctx.strokeStyle = `rgba(255,255,220,${1 - b.t * 2})`; ctx.lineWidth = 3 + Math.random() * 2; ctx.lineJoin = 'round';

// ================= Hauptschleife =================
let vorher = performance.now(), rest = 0, hudZeit = 0;
// Pause: die Welt bleibt stehen, nur das Bild wird weiter gemalt
let pausiert = false;
function pausieren(an) {
  pausiert = an && !!spiel && spiel.modus === 'lokal' && !spiel.fertig;
  $('pausenbild').classList.toggle('versteckt', !pausiert);
  if (pausiert) { zielt = null; if (spiel) spiel.ein = {}; }   // gedrückte Knöpfe loslassen
}
function schleife(jetzt) {
  if (pausiert) { vorher = jetzt; zeichne(); requestAnimationFrame(schleife); return; }
  rest += Math.min(.1, (jetzt - vorher) / 1000); vorher = jetzt;
  while (rest >= SCHRITT) {
    rest -= SCHRITT; zeit += SCHRITT;
    for (const w of wolken) w.x += ((spiel ? spiel.wind : 30) * .15 + 6) * SCHRITT;
    if (spiel && !spiel.fertig) {
      // Wartet dieses Gerät auf einen Zug von einem anderen? Sobald er da ist: abspielen
      if (spiel.quelle === 'fern' && spiel.zuege[spiel.zug]) { spiel.quelle = 'wiederholung'; spiel.rec = spiel.zuege[spiel.zug]; spiel.ri = 0; }
      if (spiel.quelle === 'live') { kiDran() ? KI.update(SCHRITT) : liveEingaben(SCHRITT); zielSenden(); simSchritt(); if (spiel.quelle === 'live') teilSenden(); }
      else if (spiel.quelle === 'wiederholung') {
        spiel.rec = spiel.zuege[spiel.zug] || spiel.rec;            // neuestes Stück nehmen
        if (spiel.endeWartet) { if (spiel.rec.s) { spiel.endeWartet = false; zugEnde(); } }
        else {
          // Fertige Züge schneller abspielen; beim Live-Zuschauen nur aufholen, wenn wir weit hinten sind
          const vorne = spiel.rec.s ? 1e9 : spiel.rec.bis - spiel.bild;
          const mal = spiel.zuege.length > spiel.zug + 1 ? 6 : spiel.rec.s ? (spiel.phase === 'zielen' ? 2 : 1) : vorne > 90 ? 2 : 1;
          for (let i = 0; i < mal && spiel.quelle === 'wiederholung' && !spiel.fertig && !spiel.endeWartet; i++) {
            if (!spiel.rec.s && spiel.bild >= spiel.rec.bis) break;    // auf das nächste Stück warten
            simSchritt(); spiel.fortschritt = performance.now();
          }
        }
      }
    } else for (const w of wuermer) updateWurm(w, SCHRITT);
    updateTeilchen(SCHRITT);
    spurMerken();
    // Tageszeit langsam nachführen; Blätter wehen mit dem Wind
    tz += ((spiel ? Math.min(4, (rundeNr() - 1) / 2.5) : 0) - tz) * SCHRITT * .5;
    if (spiel) for (const b of blaetter) {
      b.x += (spiel.wind * .6 / bw) * SCHRITT; b.y += (Math.sin(zeit * 2 + b.ph) * 15 + 8) / bh * SCHRITT;
      if (b.x > 1.05) b.x = -.05; if (b.x < -.05) b.x = 1.05; if (b.y > 1.05) b.y = -.05;
    }
    wackeln *= .9;
    kamera(SCHRITT);
  }
  zeichne();
  if (jetzt - hudZeit > 100) { hud(); hudZeit = jetzt; }
  requestAnimationFrame(schleife);
}

function wahlLesen(modus) { const w = speicher.lies('wu-wahl-' + modus) || JSON.parse(JSON.stringify(WAHL_STANDARD[modus])); w.farben = speicher.lies('wu-farben') || w.farben || [0, 1, 2]; w.anzahl = w.anzahl || [4, 4, 4]; return w; }
function teamWahl(modus) {

        if (m[y][x]) dunkel++;

      }
      for (let a = 0; a < n; a++) { let lx = 1, ly = 1;
        for (let b = 1; b < n; b++) {

/* =====================================================================
   SYNC ÜBER GITHUB – wie bei Морской бой
   Alle Geräte lesen/schreiben EINE verschlüsselte Datei im privaten Repo.
   Der Schlüssel (AES-GCM) und der Token liegen nur auf den Geräten.
   Die Einladung ist dieselbe wie bei Морской бой (MB1~…).
   ===================================================================== */
const b64 = u8 => { let s = ''; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64 = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); return Uint8Array.from(atob(s + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0)); };

const Sync = {
  cfg: speicher.lies('wu-sync') || (speicher.lies('wu-zurueckgesetzt') ? null : speicher.lies('mb-sync')),   // nach „zurücksetzen“ nicht die Морской-бой-Einrichtung nehmen   // { o: Besitzer, r: Repo, t: Token, k: Schlüssel }
  geraet: speicher.lies('wu-geraet') || (() => { const id = b64(crypto.getRandomValues(new Uint8Array(6))); speicher.schreib('wu-geraet', id); return id; })(),
  pfad: 'wuermer/aktuell.json',
  etag: null, sha: null, stand: null, schluessel: null,

  einladung() { const c = this.cfg; return ['MB1', c.o, c.r, c.t, c.k].join('~'); },
  einladungsLink() { return location.origin + location.pathname + '#einladung=' + this.einladung(); },
  lesEinladung(text) {
    text = decodeURIComponent((text || '').trim()).replace(/^.*einladung=/, '').replace(/\s/g, '');
    const t = text.split('~');
    if (t.length !== 5 || t[0] !== 'MB1') return null;
    try { if (unb64(t[4]).length !== 32) return null; } catch { return null; }
    return { o: t[1], r: t[2], t: t[3], k: t[4] };
  },
  speichern(cfg) { this.cfg = cfg; this.schluessel = null; this.etag = this.sha = this.stand = null; speicher.schreib('wu-sync', cfg); speicher.weg('wu-zurueckgesetzt');
    Object.assign(Signal, { schluessel: null, etag: null, sha: null, stand: null }); },

  url() { return `https://api.github.com/repos/${this.cfg.o}/${this.cfg.r}/contents/${this.pfad}`; },
  kopf() { return { Authorization: 'Bearer ' + this.cfg.t, Accept: 'application/vnd.github+json' }; },
  async key() {
    if (!this.schluessel) this.schluessel = await crypto.subtle.importKey('raw', unb64(this.cfg.k), 'AES-GCM', false, ['encrypt', 'decrypt']);
    return this.schluessel;
  },
  async verschluesseln(obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const d = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await this.key(), new TextEncoder().encode(JSON.stringify(obj)));
    return { v: 1, iv: b64(iv), d: b64(new Uint8Array(d)) };
  },
  async entschluesseln(roh) {
    try {
      const d = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(roh.iv) }, await this.key(), unb64(roh.d));
      return JSON.parse(new TextDecoder().decode(d));
    } catch {
      const f = new Error('Der Spielstand auf GitHub hat einen anderen Schlüssel als dieses Gerät.');
      f.schluessel = true; throw f;
    }
  },
  // Lesen. Mit ETag fragt GitHub nur „hat sich was geändert?“ – das ist schnell.
  async lesen(frisch = false) {
    const h = this.kopf(); if (!frisch && this.etag) h['If-None-Match'] = this.etag;
    const res = await fetch(this.url(), { headers: h, cache: 'no-store' });
    if (res.status === 304) return this.stand;
    if (res.status === 404) { this.sha = this.etag = this.stand = null; return null; }
    if (res.status === 401) throw new Error('Token ungültig oder abgelaufen.');
    if (!res.ok) throw new Error('GitHub antwortet ' + res.status);
    const j = await res.json();
    this.sha = j.sha;
    this.stand = await this.entschluesseln(JSON.parse(atob(j.content.replace(/\s/g, ''))));
    this.etag = res.headers.get('ETag');                 // erst merken, wenn Entschlüsseln geklappt hat
    return this.stand;
  },
  async schreiben(stand) {
    const body = { message: 'Würmer: Zug', content: btoa(JSON.stringify(await this.verschluesseln(stand))) };
    if (this.sha) body.sha = this.sha;
    const res = await fetch(this.url(), { method: 'PUT', headers: { ...this.kopf(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (res.status === 409 || res.status === 422) return false;          // jemand war schneller
    if (res.status === 429 || res.status === 403) {
      const warte = +res.headers.get('Retry-After') || 0, text = await res.text().catch(() => '');
      if (res.status === 429 || warte || /rate limit/i.test(text)) { const f = new Error('GitHub bremst gerade – Züge kommen etwas später'); f.bremse = warte || 60; throw f; }
    }
    if (res.status === 403 || res.status === 404) throw new Error('Token darf nicht schreiben (Contents: Read and write?).');
    if (!res.ok) throw new Error('GitHub antwortet ' + res.status);
    const j = await res.json(); this.sha = j.content.sha; this.stand = stand; this.etag = null;
    return true;
  },
  // Ändern = neu lesen, Funktion anwenden, zurückschreiben. Bei Gleichzeitigkeit: nochmal.
  async aendern(fn) {
    for (let i = 0; i < 6; i++) {
      const alt = await this.lesen(true);
      const neu = fn(alt ? JSON.parse(JSON.stringify(alt)) : null);
      if (!neu) return alt;
      if (await this.schreiben(neu)) return neu;
      await warte(300 + Math.random() * 700);
    }
    throw new Error('Ein anderes Gerät schreibt gerade – bitte nochmal.');
  },
};

/* =====================================================================
   ONLINE-SPIEL
   Gemeinsamer Stand: { id, status, teams: 2|3, startzahl, geraete:[A,B,C], zuege:[…] }
   status: wartet → laeuft → ende.  Gerät Nr. i spielt Team Nr. i.
   Ein Zug: { n, t, e: Eingaben, k: Krater, s: Stand am Ende, fe: letzte Bild-Nummer }
   ===================================================================== */
const Online = {
  timer: null, tickt: false, fehlerText: '', sendet: false,
  start() { this.stop(); this.timer = setInterval(() => this.tick(), 1500); this.tick(); },
  stop() { clearInterval(this.timer); this.timer = null; },
  async tick() {
    if (this.tickt || document.hidden || !this.timer || !Sync.cfg) return;
    this.tickt = true;
    try {
      if (spiel && spiel.ausstehend.length) await this.senden();
      const st = await Sync.lesen();
      if (!this.sendet) this.fehlerText = '';
      steuern(st);
    } catch (e) {
      this.fehlerText = e.message;
      if (!spiel) lobby('⚠ ' + e.message, e.schluessel ? [['Alten Spielstand ersetzen', () => neuesOnlineSpiel(['m', 'm'], 'mittel', true)]] : [['Nochmal', () => this.tick()]]);
    } finally { this.tickt = false; }
  },
  // Eigene Züge der Reihe nach hochladen
  async senden() {
    if (this.sendet || Date.now() < (this.pauseBis || 0)) return;
    this.sendet = true;
    try {
      while (spiel && spiel.ausstehend.length) {
        const rec = spiel.ausstehend[0], id = spiel.id;
        const neu = await Sync.aendern(s => {
          if (!s || s.id !== id || s.status !== 'laeuft') return null;
          if (s.zuege.length === rec.n) s.zuege.push(rec);
          else if (s.zuege.length === rec.n + 1 && neuerAls(rec, s.zuege[rec.n])) s.zuege[rec.n] = rec;
          else return null;
          if (rec.ende !== undefined) { s.status = 'ende'; s.sieger = rec.ende; }
          return s;
        });
        if (spiel) { const i = spiel.ausstehend.indexOf(rec); if (i >= 0) spiel.ausstehend.splice(i, 1); }   // geschickt (oder überholt)
        if (!neu || neu.id !== id) break;
      }
      this.fehlerText = '';
    } catch (e) { this.fehlerText = e.message; if (e.bremse) this.pauseBis = Date.now() + e.bremse * 1000; }
    finally { this.sendet = false; }
  },
};
document.addEventListener('visibilitychange', () => { if (!document.hidden && Online.timer) Online.tick(); });

function onlineMenue() {
  hintergrund();
  if (!Sync.cfg) return setupZeigen();
  lobbyText = ''; lobby('Verbinde mit GitHub …', []);
  Online.start();
}

function lobby(text, knoepfe) {
  karte('<h2>🌐 Online</h2>', text, knoepfe, '', [['📱 Einladung zeigen', einladungZeigen], ['⚙ Gerät zurücksetzen', zuruecksetzen], ['← Zurück', startMenue]]);
}
const NEU_KNOEPFE = () => [[wurmIcon(0) + 'Neues Spiel einrichten', () => teamWahl('online')]];
const menschen = st => (st.art || Array(st.teams).fill('m')).map((a, i) => a === 'm' ? i : -1).filter(i => i >= 0);

// Entscheidet anhand des gemeinsamen Stands, was dieses Gerät zeigt
let lobbyText = '';
function steuern(st) {
  if (spiel && spiel.modus === 'online') {
    if (spiel.fertig) return;
    if (!st || st.id !== spiel.id || (st.status === 'ende' && st.sieger === -1)) {
      hintergrund(); lobbyText = '';
      return lobby('Das Spiel wurde beendet.', NEU_KNOEPFE());
    }
    for (const rec of st.zuege) zugMerken(rec);
    return;
  }
  if (spiel) return;                                          // lokales Spiel läuft
  const ich = st ? st.geraete.indexOf(Sync.geraet) : -1;
  if (st) teamsSetzen(st.farben);
  // Lobby nur neu malen, wenn sich etwas geändert hat (sonst flackern die Knöpfe)
  const zeige = (text, knoepfe) => { if (text !== lobbyText) { lobbyText = text; lobby(text, knoepfe); } };
  if (!st || st.status === 'ende') return zeige('Kein offenes Spiel.', NEU_KNOEPFE());
  const mensch = menschen(st), cpu = (st.art || []).map((a, i) => a === 'c' ? TEAMS[i].name : '').filter(Boolean);
  const mitCpu = cpu.length ? `\n🤖 Computer: ${cpu.join(', ')}` : '';
  if (st.status === 'wartet') {
    const wer = st.geraete.map((_, i) => TEAMS[mensch[i]].name).join(', ');
    if (ich >= 0) return zeige(`Warte auf Mitspieler … (${st.geraete.length} von ${mensch.length} Geräten)\nSchon da: ${wer}${mitCpu}\nDu bist ${TEAMS[mensch[ich]].name}.\n\nAuf dem anderen Gerät: Würmer → Online → Beitreten`, [['Abbrechen', abbrechen]]);
    return zeige(`Ein Spiel wartet auf dich! (${st.geraete.length} von ${mensch.length} Geräten da)${mitCpu}\nDu wirst ${TEAMS[mensch[st.geraete.length]].name}.`, [[wurmIcon(1) + 'Beitreten', beitreten], ['Neues Spiel (altes beenden)', () => teamWahl('online')]]);
  }
  if (st.status === 'laeuft') {
    if (ich >= 0) { lobbyText = ''; return spielLaden(st, ich); }
    return zeige('Auf anderen Geräten läuft gerade ein Spiel.', [['Neues Spiel (altes beenden)', () => teamWahl('online')]]);
  }
}

// Online-Spiel aufbauen – auch nach einem Neustart der App mitten im Spiel
function spielLaden(st, ich) {
  neuesSpiel({ n: st.teams, art: st.art, stufe: st.stufe, mitWind: st.wind !== false, anzahl: st.anzahl, startzahl: st.startzahl, schwer: st.schwer || 0, modus: 'online', ich: menschen(st)[ich], host: ich === 0, id: st.id });
  spiel.zuege = st.zuege.slice();
  const fertige = st.zuege.filter(z => z.s);
  if (fertige.length) {
    const letzter = fertige[fertige.length - 1];
    neuAufbauen(letzter.n);
    standSetzen(letzter.s);
    graeber = wuermer.filter(w => w.tot).map(w => ({ x: w.x, y: w.y, vy: 0, r: 6, farbe: TEAMS[w.team].farbe }));
    spiel.zug = letzter.n;
  }
  naechsterZug();
  Direkt.start(st);
}

async function neuesOnlineSpiel(art, stufe, ersetzen = false, direkt = true, farben = [0, 1, 2], wind = true, anzahl = null) {
  const st = Sync.stand;
  if (!ersetzen && st && st.status === 'laeuft') {
    Online.stop();
    const ok = await frage('Altes Spiel beenden?', 'Auf den Geräten läuft noch ein Spiel. Wenn du ein neues startest, ist das alte für alle vorbei.', 'Ja, neues Spiel');
    if (!ok) return onlineMenue();
    Online.start();
  }
  const neu = { id: b64(crypto.getRandomValues(new Uint8Array(6))), status: 'wartet', teams: art.length, art, stufe, direkt, farben, wind, anzahl, schwer: meinSchwer(),
                startzahl: crypto.getRandomValues(new Uint32Array(1))[0], geraete: [Sync.geraet], zuege: [], zeit: Date.now() };
  if (menschen(neu).length === 1) neu.status = 'laeuft';        // nur ich gegen Computer: sofort los
  lobbyText = ''; lobby('Starte …', []);
  try {
    if (ersetzen) {
      for (let i = 0; i < 3; i++) { await Sync.lesen(true).catch(() => {}); if (await Sync.schreiben(neu)) break; }
    } else await Sync.aendern(() => neu);
    Online.tick();
  } catch (e) { lobby('⚠ ' + e.message, [['Nochmal', () => neuesOnlineSpiel(art, stufe, ersetzen)]]); }
}
async function beitreten() {
  lobbyText = ''; lobby('Trete bei …', []);
  try {
    await Sync.aendern(s => {
      if (!s || s.status !== 'wartet' || s.geraete.includes(Sync.geraet) || s.geraete.length >= menschen(s).length) return null;
      s.geraete.push(Sync.geraet);
      s.schwer = Math.min(s.schwer ?? 100, meinSchwer());          // an den Schwächsten anpassen
      if (s.geraete.length === menschen(s).length) s.status = 'laeuft';      // alle da – los geht's
      return s;
    });
    Online.tick();
  } catch (e) { lobby('⚠ ' + e.message, [['Nochmal', beitreten]]); }
}
async function abbrechen() {
  try { await Sync.aendern(s => s && s.geraete.includes(Sync.geraet) ? { ...s, status: 'ende', sieger: -1 } : null); } catch {}
  lobbyText = ''; Online.tick();
}
async function zuruecksetzen() {
  Online.stop(); lobbyText = '';
  const ok = await frage('⚠️ Gerät zurücksetzen?',
    'Zugang (Token) und geheimer Schlüssel werden von <b>diesem Gerät</b> gelöscht.\nDanach muss es neu eingerichtet werden – z. B. mit dem QR-Code von einem anderen Gerät.\nEin laufendes Online-Spiel kann dieses Gerät dann nicht mehr fortsetzen.',
    'Ja, zurücksetzen');
  if (!ok) return onlineMenue();
  speicher.weg('wu-sync'); speicher.schreib('wu-zurueckgesetzt', true); Sync.cfg = null; setupZeigen();
}
// Eigene Sicherheitsabfrage (statt des kleinen Systemfensters) – antwortet mit true/false
function frage(titel, text, ja, nein = 'Abbrechen') {
  return new Promise(ok => karte(`<h2>${titel}</h2>`, text, [[ja, () => ok(true), 'gefahr'], [nein, () => ok(false), 'zweit']]));
}

/* =====================================================================
   WLAN-DIREKT (WebRTC): Geräte reden direkt miteinander – ohne Umweg über GitHub.
   GitHub braucht man nur kurz zum „Hände schütteln“: Der Gastgeber legt ein
   Angebot in die Datei wuermer/signal.json, die anderen Geräte legen ihre
   Antwort dazu. Danach fließen die Züge direkt (verschlüsselt) von Gerät zu Gerät.
   Ohne fremde Server (kein STUN/TURN) – darum klappt es nur im selben WLAN.
   Wenn es nicht klappt, läuft das Spiel ganz normal über GitHub weiter.
   ===================================================================== */
const Signal = Object.assign(Object.create(Sync), { pfad: 'wuermer/signal.json', etag: null, sha: null, stand: null, schluessel: null });
const hatKandidaten = sdp => /a=candidate/.test(sdp || '');
const Direkt = {
  an: false, pcs: {}, kanaele: {}, timer: null, problem: '', angebote: {},
  start(st) {
    this.stop();
    if (!st.direkt || !window.RTCPeerConnection || st.geraete.length < 2) return;
    Object.assign(this, { an: true, st, id: st.id, host: st.geraete[0] === Sync.geraet, problem: '', letztesAngebot: null,
                          angebote: {}, version: 0, letzterVersuch: 0, pause: 15000, warVerbunden: false, getrenntSeit: 0, startZeit: Date.now() });
    this.andere = this.host ? st.geraete.slice(1) : [st.geraete[0]];
    this.timer = setInterval(() => this.wachen(), 2000);
    this.wachen();
  },
  stop() {
    clearInterval(this.timer); this.timer = null;
    for (const pc of Object.values(this.pcs)) try { pc.close(); } catch {}
    this.pcs = {}; this.kanaele = {}; this.an = false;
  },
  // Nach 12 s noch nie verbunden? Dann Hinweis + ⚡-Knopf (Safari braucht evtl. die Kamera-Erlaubnis)
  klapptNicht() { return this.an && !this.warVerbunden && Date.now() - this.startZeit > 12000; },
  offen(g) { return this.kanaele[g] && this.kanaele[g].readyState === 'open'; },
  alleVerbunden() { return this.an && this.andere.every(g => this.offen(g)); },
  // Wachhund: Ist die Verbindung weg (z. B. iPhone gesperrt), wird neu verbunden
  wachen() {
    if (!this.an) return;
    if (this.alleVerbunden()) { this.warVerbunden = true; this.getrenntSeit = 0; this.pause = 15000; this.letzterVersuch = 0; return; }
    if (!this.getrenntSeit) this.getrenntSeit = Date.now();
    if (!this.host) return this.antworten();
    // erster Neuversuch nach 3 s, danach immer seltener
    if (!this.beschaeftigt && (!this.warVerbunden || Date.now() - this.getrenntSeit > 3000) && Date.now() - this.letzterVersuch > this.pause) {
      this.letzterVersuch = Date.now();
      this.pause = Math.max(15000, Math.min(120000, this.pause * 1.6));      // klappt es gar nicht: seltener probieren
      this.anbieten();
    } else this.antwortenHolen();
  },
  senden(rec) {
    if (!this.an) return;
    const d = JSON.stringify({ id: this.id, rec });
    for (const k of Object.values(this.kanaele)) if (k.readyState === 'open') try { k.send(d); } catch {}
  },
  kanal(k, von) {
    this.kanaele[von] = k;
    k.onopen = () => { this.problem = ''; if (this.alleVerbunden()) this.verbundenSeit = Date.now(); this.warVerbunden = true; this.getrenntSeit = 0; };
    k.onclose = () => { if (this.an) this.wachen(); };
    k.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.id !== this.id) return;
      zugMerken(m.rec);
      // Der Gastgeber reicht Züge an die anderen Geräte weiter (bei 3 Spielern)
      if (this.host) for (const [g, k2] of Object.entries(this.kanaele)) if (g !== von && k2.readyState === 'open') try { k2.send(e.data); } catch {}
    };
  },
  iceFertig(pc) {
    return new Promise(ok => {
      if (pc.iceGatheringState === 'complete') return ok();
      const t = setTimeout(ok, 3000);
      pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); ok(); } });
    });
  },
  async anbieten() {                                       // Gastgeber: neue Angebote für alle, die nicht verbunden sind
    this.beschaeftigt = true;
    try {
      // sauberer Neustart: alle alten Verbindungen weg, für jedes Gerät ein neues Angebot
      const v = ++this.version, neu = {};
      for (const pc of Object.values(this.pcs)) try { pc.close(); } catch {}
      this.pcs = {}; this.kanaele = {}; this.angebote = {};      // alte Angebote vergessen – sonst passt eine alte Antwort
      for (const g of this.andere) {
        const pc = new RTCPeerConnection({ iceServers: [] }); this.pcs[g] = pc;
        this.kanal(pc.createDataChannel('spiel'), g);
        await pc.setLocalDescription(await pc.createOffer()); await this.iceFertig(pc);
        neu[g] = this.angebote[g] = { v, sdp: pc.localDescription.sdp };
      }
      // Safari verrät die eigene WLAN-Adresse erst nach einer Kamera-Erlaubnis
      this.problem = Object.values(neu).length && !Object.values(neu).some(a => hatKandidaten(a.sdp)) ? 'oben links ⚡ tippen' : '';
      const id = this.id;
      await Signal.aendern(s => {
        const z = s && s.id === id ? s : { id, angebote: {}, antworten: {} };
        for (const g in neu) { z.angebote[g] = neu[g]; delete z.antworten[g]; }
        z.zeit = Date.now(); return z;
      });
    } catch {} finally { this.beschaeftigt = false; }
  },
  async antwortenHolen() {
    if (this.beschaeftigt) return;                          // nicht dazwischenfunken, während neue Angebote entstehen
    try {
      const s = await Signal.lesen();
      if (!s || s.id !== this.id) return;
      if (s.bitte && s.bitte > (this.letzteBitte || 0)) { this.letzteBitte = s.bitte; this.letzterVersuch = 0; this.pause = 0; return; }   // ein Gerät bittet um Neustart
      for (const g of this.andere) {
        const pc = this.pcs[g], a = s.antworten && s.antworten[g], mein = this.angebote[g];
        if (a && pc && mein && a.v === mein.v && pc.signalingState === 'have-local-offer') await pc.setRemoteDescription({ type: 'answer', sdp: a.sdp });
      }
    } catch {}
  },
  async antworten() {                                      // die anderen Geräte: auf neue Angebote antworten
    if (this.beschaeftigt) return;
    this.beschaeftigt = true;
    try {
      const s = await Signal.lesen();
      if (!s || s.id !== this.id || !s.angebote) return;
      const angebot = s.angebote[Sync.geraet];
      if (!angebot || !angebot.sdp || angebot.sdp === this.letztesAngebot) return;
      this.letztesAngebot = angebot.sdp;
      this.problem = hatKandidaten(angebot.sdp) ? '' : 'Gastgeber muss ⚡ tippen';
      const wirt = this.andere[0];
      for (const alt of Object.values(this.pcs)) try { alt.close(); } catch {}
      this.pcs = {}; this.kanaele = {};
      const pc = new RTCPeerConnection({ iceServers: [] }); this.pcs[wirt] = pc;
      pc.ondatachannel = e => this.kanal(e.channel, wirt);
      await pc.setRemoteDescription({ type: 'offer', sdp: angebot.sdp });
      await pc.setLocalDescription(await pc.createAnswer()); await this.iceFertig(pc);
      const antwort = { v: angebot.v, sdp: pc.localDescription.sdp }, id = this.id, ich = Sync.geraet;
      await Signal.aendern(s => s && s.id === id ? (s.antworten = { ...s.antworten, [ich]: antwort }, s) : null);
    } catch {} finally { this.beschaeftigt = false; }
  },
};
document.addEventListener('visibilitychange', () => { if (!document.hidden && Direkt.an) Direkt.wachen(); });
// Gastgeber: Kamera einmal kurz erlauben → Safari gibt die WLAN-Adresse frei → neu verbinden
$('direkt').onclick = async () => {
  try { const s = await navigator.mediaDevices.getUserMedia({ video: true }); s.getTracks().forEach(t => t.stop()); } catch {}
  if (!Direkt.st) return;
  Direkt.startZeit = Date.now();
  if (Direkt.host) { Direkt.letzterVersuch = 0; Direkt.pause = 0; Direkt.wachen(); }
  else {                                                     // Gastgeber um ein neues Angebot bitten
    Direkt.letztesAngebot = null; const id = Direkt.id;
    try { await Signal.aendern(s => s && s.id === id ? { ...s, bitte: Date.now() } : null); } catch {}
  }
};

/* ---------- Einrichten & Einladung ---------- */
function setupZeigen(meldungText = '') {
  Online.stop(); lobbyText = '';
  karte('<h2>Gerät einrichten</h2>', '', [], `
    <h3>A · ICH HABE EINE EINLADUNG</h3>
    <div class="knoepfe"><button id="s-scannen">📷 QR-Code scannen</button></div>
    <p style="margin-top:10px">Oder den Einladungs-Code einfügen<br><small>(Морской бой-Einladung geht auch!)</small></p>
    <textarea id="s-code" placeholder="MB1~…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="knoepfe"><button id="s-annehmen">Annehmen</button></div>
    <h3>B · ERSTES GERÄT (ELTERN)</h3>
    <p style="text-align:left">Privates Repo für die Spielstände und ein Token, der nur dieses Repo lesen und schreiben darf.</p>
    <input id="s-repo" placeholder="besitzer/repo" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input id="s-token" type="password" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="knoepfe"><button id="s-verbinden">Verbinden</button></div>
    <p id="s-meldung"></p>`, [['← Zurück', startMenue]]);
  meldung(meldungText);
  $('s-scannen').onclick = () => Scanner.start();
  $('s-annehmen').onclick = () => einladungAnnehmen($('s-code').value);
  $('s-verbinden').onclick = verbinden;
}
function meldung(text, fehler) { const m = $('s-meldung'); if (!m) return; m.textContent = text; m.classList.toggle('fehler', !!fehler); }

async function verbinden() {
  const teile = $('s-repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').split('/');
  const token = $('s-token').value.trim();
  if (teile.length !== 2 || !teile[0] || !teile[1]) return meldung('Repo bitte als besitzer/name eingeben.', true);
  if (!token) return meldung('Bitte den Token einfügen.', true);
  meldung('Prüfe …');
  try {
    const res = await fetch(`https://api.github.com/repos/${teile[0]}/${teile[1]}`, { headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
    if (res.status === 401) return meldung('Token wird nicht akzeptiert.', true);
    if (!res.ok) return meldung('Repo nicht gefunden – darf der Token darauf zugreifen?', true);
    const j = await res.json();
    if (!j.private) return meldung('Das Repo ist öffentlich! Bitte ein PRIVATES Repo nehmen.', true);
    const k = b64(crypto.getRandomValues(new Uint8Array(32)));     // neuer geheimer Schlüssel
    Sync.speichern({ o: teile[0], r: teile[1], t: token, k });
    einladungZeigen();
  } catch (e) { meldung('Keine Verbindung: ' + e.message, true); }
}

function einladungAnnehmen(text) {
  const cfg = Sync.lesEinladung(text);
  if (!cfg) return meldung('Das ist kein gültiger Einladungs-Code.', true);
  Sync.speichern(cfg);
  onlineMenue();
}

function einladungZeigen() {
  Online.stop(); lobbyText = '';
  karte('<h2>Einladung</h2>', 'Mit der Kamera des anderen Geräts scannen.\nOder Code kopieren und dort unter „Einfügen“ einsetzen.\n<b class="fehler">Nur eigenen Geräten zeigen – enthält den Schlüssel!</b>',
    [['📋 Code kopieren', async () => { try { await navigator.clipboard.writeText(Sync.einladung()); $('kopiert').textContent = '✓ kopiert'; } catch {} }], ['Fertig', onlineMenue]],
    '<canvas id="qr"></canvas><p id="kopiert"></p>');
  QR.malen($('qr'), Sync.einladungsLink());
}

/* ---------- QR-Code mit der Kamera lesen (jsQR wird erst hier geladen) ---------- */
const Scanner = {
  strom: null, an: false,
  async laden() {
    if (window.jsQR) return;
    await new Promise((ok, fehler) => { const s = document.createElement('script'); s.src = 'jsQR.js'; s.onload = ok; s.onerror = fehler; document.head.appendChild(s); });
  },
  async start() {
    const video = document.querySelector('#scanner video');
    $('sc-text').textContent = 'QR-Code der Einladung in den Rahmen halten';
    $('scanner').classList.add('on');
    try {
      await this.laden();
      this.strom = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      video.srcObject = this.strom; await video.play();
    } catch (e) {
      this.stopp();
      return meldung('Kamera nicht verfügbar – in den Einstellungen erlauben oder den Code einfügen.', true);
    }
    this.an = true;
    const cv = document.createElement('canvas'), c = cv.getContext('2d', { willReadFrequently: true });
    const suchen = () => {
      if (!this.an) return;
      if (video.readyState >= 2 && video.videoWidth) {
        const f = Math.min(1, 640 / Math.max(video.videoWidth, video.videoHeight));
        cv.width = video.videoWidth * f; cv.height = video.videoHeight * f;
        c.drawImage(video, 0, 0, cv.width, cv.height);
        const code = jsQR(c.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: 'dontInvert' });
        if (code && Sync.lesEinladung(code.data)) { this.stopp(); return einladungAnnehmen(code.data); }
        if (code) $('sc-text').textContent = 'Das ist kein Einladungs-Code.';
      }
      requestAnimationFrame(suchen);
    };
    requestAnimationFrame(suchen);
  },
  stopp() {
    this.an = false;
    if (this.strom) this.strom.getTracks().forEach(t => t.stop());
    this.strom = null; $('scanner').classList.remove('on');
  },
};
$('sc-stopp').onclick = () => Scanner.stopp();

// Einladung per QR-Code: Die Kamera öffnet die Seite mit #einladung=… in Safari
function einladungAusLink() {
  if (!location.hash.startsWith('#einladung=')) return false;
  const text = location.hash.slice(1);
  history.replaceState(null, '', location.pathname);           // Schlüssel nicht im Verlauf stehen lassen
  const cfg = Sync.lesEinladung(text);
  if (!cfg) return false;
  Sync.speichern(cfg);
  const app = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (app) { onlineMenue(); return true; }
  // In Safari: Die Home-Bildschirm-App hat einen eigenen Speicher – deshalb Code zum Einfügen anbieten
  karte('<h2>Einladung erhalten ✓</h2>', 'Dieses Gerät ist jetzt eingerichtet (in Safari).\n\nSpielst du über die App auf dem Home-Bildschirm?\n1. „Code kopieren“ tippen\n2. App öffnen → Online → einfügen → „Annehmen“',
    [['📋 Code kopieren', async () => { try { await navigator.clipboard.writeText(Sync.einladung()); } catch {} startMenue(); }], ['Hier spielen', onlineMenue]]);
  return true;
}

// Hintergrund-Welt fürs Menü
baueLandschaft((Math.random() * 2 ** 31) >>> 0);

kam.x = W / 2; kam.y = H * .55;

requestAnimationFrame(schleife);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

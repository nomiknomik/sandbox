<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schlange">
<meta name="theme-color" content="#14361F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Schlange</title>
<style>
  /* Farben an einer Stelle */
  :root{--bg:#0E2416;--panel:#173A24ee;--text:#F2FFF4;--muted:#A9C9B0;--accent:#2BB673;--gold:#FFC93C}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:radial-gradient(circle at 30% 20%,#1F5A33,var(--bg) 70%);color:var(--text);
       font:18px/1.4 -apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #oben{position:fixed;top:calc(8px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none}
  .pille{background:#0006;border-radius:14px;padding:6px 14px;font-weight:700;font-size:20px;display:flex;gap:6px;align-items:center}
  #portal{position:fixed;top:calc(8px + env(safe-area-inset-top));left:10px;padding:8px 12px;border-radius:12px;background:#0005;color:inherit;text-decoration:none;font-size:15px;z-index:5}
  #pause,#ton{position:fixed;top:calc(8px + env(safe-area-inset-top));padding:6px 12px;border-radius:12px;background:#0005;color:inherit;border:0;font-size:20px;z-index:5}
  #pause{right:10px} #ton{right:64px}
  #version{position:fixed;bottom:calc(2px + env(safe-area-inset-bottom));right:4px;padding:8px;font-size:12px;color:var(--muted);cursor:pointer;z-index:5}
  /* Menü und Spielende */
  .fenster{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0007;z-index:4;padding:16px}
  .fenster[hidden]{display:none}
  .karte{background:var(--panel);border-radius:24px;padding:22px 22px 18px;max-width:420px;width:100%;text-align:center;
         box-shadow:0 10px 0 #0B1F12,0 20px 40px #0008;border:2px solid #ffffff22}
  .karte h1{margin:0 0 4px;font-size:44px;letter-spacing:1px;text-shadow:0 4px 0 #0B1F12}
  .karte h1 img{height:64px;vertical-align:middle}
  .zeile{margin:14px 0 6px;color:var(--muted);font-size:15px}
  .wahl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .wahl button{font:inherit;font-size:16px;padding:8px 12px;border-radius:12px;border:2px solid #ffffff33;background:#0003;color:inherit}
  .wahl button.an{border-color:var(--gold);background:#FFC93C33}
  .farbe{width:46px;height:46px;border-radius:12px!important;padding:0!important}
  .los{font:inherit;font-weight:800;font-size:24px;margin-top:18px;padding:14px 40px;border:0;border-radius:16px;
       background:linear-gradient(#3DDC84,#1E9E58);color:#fff;box-shadow:0 6px 0 #146B3B;text-shadow:0 2px 0 #0004}
  .los:active{transform:translateY(4px);box-shadow:0 2px 0 #146B3B}
  .gross{font-size:56px;font-weight:800;margin:4px 0;color:var(--gold);text-shadow:0 4px 0 #6B4A00}
  #hilfe{font-size:14px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
  <canvas id="feld"></canvas>
  <div id="oben"><div class="pille">🍎 <span id="punkte">0</span></div><div class="pille">🏆 <span id="rekord">0</span></div></div>
  <a id="portal" href="../../">🕹 Alle Spiele</a>
  <button id="ton">🔊</button>
  <button id="pause">⏸</button>
  <div id="version"></div>

  <!-- Startmenü -->
  <div class="fenster" id="menue">
    <div class="karte">
      <h1><span id="titelbild">🐍</span> Schlange</h1>
      <div class="zeile">Farbe der Schlange</div>
      <div class="wahl" id="farben"></div>
      <div class="zeile">Tempo</div>
      <div class="wahl" id="tempos"></div>
      <div class="zeile">Wand</div>
      <div class="wahl" id="waende"></div>
      <button class="los" id="start">▶ Los!</button>
      <div id="hilfe">Wischen oder Pfeiltasten. Iss Obst, werde lang – aber beiß dich nicht selbst!</div>
    </div>
  </div>

  <!-- Spielende -->
  <div class="fenster" id="ende" hidden>
    <div class="karte">
      <div style="font-size:22px">Autsch! 💥</div>
      <div class="gross" id="endpunkte">0</div>
      <div id="endtext" style="color:var(--muted)"></div>
      <button class="los" id="nochmal">🔁 Nochmal</button><br>
      <button class="los" id="zummenue" style="font-size:18px;padding:10px 24px;background:#0004;box-shadow:none">Menü</button>
    </div>
  </div>

<script>
// Bei jeder Änderung hochzählen (und CACHE in sw.js).
const APP_VERSION = '0.1';
// Version unten rechts antippen = nach Update suchen.
const versionEl = document.getElementById('version');
versionEl.textContent = 'v' + APP_VERSION;
versionEl.onclick = async () => {
  const zeig = (text, ms) => { versionEl.textContent = text; if (ms) setTimeout(() => versionEl.textContent = 'v' + APP_VERSION, ms); };
  zeig('suche Update …');
  try {
    const t = await (await fetch('index.html?u=' + Date.now(), { cache: 'no-store' })).text();
    const neu = (t.match(/APP_VERSION = '([^']+)'/) || [])[1];
    if (!neu || neu === APP_VERSION) return zeig('✓ aktuell (v' + APP_VERSION + ')', 2500);
    zeig('lade v' + neu + ' …');
    const reg = 'serviceWorker' in navigator && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update().catch(() => {});
    await new Promise(r => setTimeout(r, 1200));
    location.replace(location.pathname + '?v=' + encodeURIComponent(neu));
  } catch { zeig('offline – v' + APP_VERSION, 2500); }
};

// ---------- Bilder (kommen später aus ChatGPT, bis dahin Emojis) ----------
// Liegt eine Datei in bilder/, wird sie benutzt – sonst wird das Emoji gemalt.
const BILDER = {
  '🍎': 'apfel', '🍒': 'kirschen', '🍓': 'erdbeere', '🍌': 'banane', '🍉': 'melone',
  '🍇': 'trauben', '🍊': 'orange', '🥕': 'karotte', '🌟': 'goldapfel', '💎': 'diamant', '🐍': 'schlange',
};
const bildCache = {};
for (const [emoji, datei] of Object.entries(BILDER)) {
  const img = new Image();
  img.onload = () => { bildCache[emoji] = img; if (emoji === '🐍') document.getElementById('titelbild').innerHTML = '<img src="' + img.src + '" alt="">'; };
  img.src = 'bilder/' + datei + '.webp';
}

// ---------- Einstellungen (merkt sich das Gerät) ----------
const FARBEN = { gruen: ['#4CD964', '#2E9E45', '#1C6B2E'], blau: ['#4DB8FF', '#2479D6', '#174C8F'],
                 lila: ['#C07CFF', '#8A45D9', '#5A2A96'], gold: ['#FFD54A', '#E0A21A', '#9A6A08'], rot: ['#FF6B5E', '#D93A2F', '#8F1F18'] };
const TEMPOS = { '🐢 Langsam': 190, '🐇 Normal': 140, '🚀 Schnell': 95 };
const WAENDE = { '🧱 Wand = Aua': true, '🌀 Durch die Wand': false };
let einst = { farbe: 'gruen', tempo: '🐇 Normal', wand: '🧱 Wand = Aua', ton: true };
try { Object.assign(einst, JSON.parse(localStorage.getItem('schlange-einst') || '{}')); } catch {}
const speichern = () => { try { localStorage.setItem('schlange-einst', JSON.stringify(einst)); } catch {} };
let rekord = 0; try { rekord = +localStorage.getItem('schlange-rekord') || 0; } catch {}
document.getElementById('rekord').textContent = rekord;

function wahlKnoepfe(id, werte, schluessel, malen) {
  const box = document.getElementById(id);
  box.innerHTML = '';
  for (const w of werte) {
    const b = document.createElement('button');
    if (malen) { b.className = 'farbe'; b.style.background = 'linear-gradient(' + FARBEN[w][0] + ',' + FARBEN[w][2] + ')'; }
    else b.textContent = w;
    if (einst[schluessel] === w) b.classList.add('an');
    b.onclick = () => { einst[schluessel] = w; speichern(); wahlKnoepfe(id, werte, schluessel, malen); ton(660, 0.05); };
    box.appendChild(b);
  }
}
wahlKnoepfe('farben', Object.keys(FARBEN), 'farbe', true);
wahlKnoepfe('tempos', Object.keys(TEMPOS), 'tempo');
wahlKnoepfe('waende', Object.keys(WAENDE), 'wand');

// ---------- Töne (ganz einfache Piepser, kein Download) ----------
let audio = null;
function ton(freq, dauer, art = 'square', lauter = 0.08) {
  if (!einst.ton) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = art; o.frequency.value = freq;
    g.gain.setValueAtTime(lauter, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dauer);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + dauer);
  } catch {}
}
const tonKnopf = document.getElementById('ton');
tonKnopf.textContent = einst.ton ? '🔊' : '🔇';
tonKnopf.onclick = () => { einst.ton = !einst.ton; speichern(); tonKnopf.textContent = einst.ton ? '🔊' : '🔇'; };

// ---------- Spielfeld ----------
const cv = document.getElementById('feld'), ctx = cv.getContext('2d');
let W, H, DPR, Z, SP, RE, ox, oy;   // Z = Kästchengröße in Pixeln, SP/RE = Spalten/Reihen
let boden = null;                   // fertig gemalter Rasen (wird nur bei Größenänderung neu gemalt)

function groesse() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  const obenFrei = 60, untenFrei = 24;
  const kurz = Math.min(W - 24, H - obenFrei - untenFrei);
  Z = Math.floor(kurz / 17);
  SP = Math.max(12, Math.floor((W - 24) / Z));
  RE = Math.max(12, Math.floor((H - obenFrei - untenFrei) / Z));
  if (SP > 30) SP = 30; if (RE > 30) RE = 30;
  ox = Math.round((W - SP * Z) / 2); oy = Math.round(obenFrei + (H - obenFrei - untenFrei - RE * Z) / 2);
  malBoden();
}

// Der Rasen: Kacheln mit kleiner Kante unten -> sieht aus wie 3D-Klötze
function malBoden() {
  boden = document.createElement('canvas');
  boden.width = W * DPR; boden.height = H * DPR;
  const b = boden.getContext('2d');
  b.scale(DPR, DPR);
  const tiefe = Math.max(6, Z * 0.35);
  // Erd-Sockel unter dem Feld
  b.fillStyle = '#5A3A1E'; rund(b, ox - 6, oy - 6, SP * Z + 12, RE * Z + 12 + tiefe, 14); b.fill();
  b.fillStyle = '#3E2712'; b.fillRect(ox - 6, oy + RE * Z + 6, SP * Z + 12, tiefe - 6);
  for (let y = 0; y < RE; y++) for (let x = 0; x < SP; x++) {
    const hell = (x + y) % 2 === 0;
    const px = ox + x * Z, py = oy + y * Z;
    b.fillStyle = hell ? '#7BD35A' : '#6CC24C'; b.fillRect(px, py, Z, Z);
    b.fillStyle = '#ffffff1a'; b.fillRect(px, py, Z, Z * 0.12);           // Licht oben
    b.fillStyle = '#0000001a'; b.fillRect(px, py + Z * 0.88, Z, Z * 0.12); // Schatten unten
    if (((x * 7 + y * 13) % 11) === 0) {                                     // ein paar Grashalme
      b.fillStyle = '#4FA83A';
      for (let i = 0; i < 3; i++) b.fillRect(px + Z * (0.3 + i * 0.15), py + Z * (0.45 - (i % 2) * 0.1), Z * 0.07, Z * 0.25);
    }
  }
  b.strokeStyle = '#2E6B22'; b.lineWidth = 3; rund(b, ox - 1.5, oy - 1.5, SP * Z + 3, RE * Z + 3, 6); b.stroke();
}
function rund(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }

// ---------- Spielzustand ----------
const OBST = ['🍎', '🍒', '🍓', '🍌', '🍉', '🍇', '🍊', '🥕'];
let schlange, vorher, richtung, wunsch, essen, bonus, punkte, laeuft = false, pausiert = false;
let takt, letzterSchritt, funken = [], texte = [], wackeln = 0, tot = false;

function neuesSpiel() {
  const mx = Math.floor(SP / 2), my = Math.floor(RE / 2);
  schlange = [{ x: mx, y: my }, { x: mx - 1, y: my }, { x: mx - 2, y: my }];
  vorher = schlange.map(s => ({ ...s }));
  richtung = { x: 1, y: 0 }; wunsch = [];
  punkte = 0; bonus = null; funken = []; texte = []; tot = false;
  takt = TEMPOS[einst.tempo];
  essen = neuesEssen(OBST[Math.floor(Math.random() * OBST.length)]);
  document.getElementById('punkte').textContent = 0;
  letzterSchritt = performance.now();
  laeuft = true; pausiert = false;
  document.getElementById('menue').hidden = true;
  document.getElementById('ende').hidden = true;
  ton(520, 0.08); setTimeout(() => ton(780, 0.12), 90);
}

function frei(x, y) {
  return !schlange.some(s => s.x === x && s.y === y) && !(essen && essen.x === x && essen.y === y) && !(bonus && bonus.x === x && bonus.y === y);
}
function neuesEssen(art, extra) {
  let x, y, n = 0;
  do { x = Math.floor(Math.random() * SP); y = Math.floor(Math.random() * RE); } while (!frei(x, y) && ++n < 500);
  return { x, y, art, geboren: performance.now(), ...extra };
}

// Ein Schritt nach vorne
function schritt() {
  if (wunsch.length) {                    // gemerkte Richtungswünsche nacheinander abarbeiten
    const w = wunsch.shift();
    if (w.x !== -richtung.x || w.y !== -richtung.y) richtung = w;
  }
  vorher = schlange.map(s => ({ ...s }));
  const kopf = schlange[0];
  let nx = kopf.x + richtung.x, ny = kopf.y + richtung.y;
  const wand = WAENDE[einst.wand];
  if (nx < 0 || ny < 0 || nx >= SP || ny >= RE) {
    if (wand) return aua();
    nx = (nx + SP) % SP; ny = (ny + RE) % RE;
  }
  const isst = (essen.x === nx && essen.y === ny);
  const isstBonus = bonus && bonus.x === nx && bonus.y === ny;
  // Der Schwanz rückt weiter – außer wir essen gerade, dann wächst die Schlange
  const koerper = isst || isstBonus ? schlange : schlange.slice(0, -1);
  if (koerper.some(s => s.x === nx && s.y === ny)) return aua();
  schlange.unshift({ x: nx, y: ny });
  if (!isst && !isstBonus) schlange.pop();
  else vorher.push({ ...vorher[vorher.length - 1] });   // neues Schwanzstück startet am alten Ende

  if (isst) {
    gewinn(1, essen);
    essen = neuesEssen(OBST[Math.floor(Math.random() * OBST.length)]);
    if (!bonus && Math.random() < 0.25) bonus = neuesEssen(Math.random() < 0.6 ? '🌟' : '💎', { bis: performance.now() + 7000 });
    takt = Math.max(60, takt - 1.5);      // ein bisschen schneller
  }
  if (isstBonus) { gewinn(bonus.art === '🌟' ? 5 : 3, bonus); bonus = null; }
}

function gewinn(n, wo) {
  punkte += n;
  document.getElementById('punkte').textContent = punkte;
  const px = ox + (wo.x + 0.5) * Z, py = oy + (wo.y + 0.5) * Z;
  const farbe = n > 1 ? '#FFD54A' : '#FF5A4A';
  for (let i = 0; i < 18; i++) {           // kleine Würfel fliegen weg
    const w = Math.random() * Math.PI * 2, v = 2 + Math.random() * 4;
    funken.push({ x: px, y: py, vx: Math.cos(w) * v, vy: Math.sin(w) * v - 3, leben: 1, farbe: i % 3 ? farbe : '#fff', g: Z * (0.12 + Math.random() * 0.12) });
  }
  texte.push({ x: px, y: py, t: '+' + n, leben: 1 });
  if (n > 1) { ton(880, 0.1, 'triangle', 0.12); setTimeout(() => ton(1320, 0.15, 'triangle', 0.12), 80); }
  else ton(600 + Math.min(punkte, 40) * 10, 0.07);
}

function aua() {
  laeuft = false; tot = true; wackeln = 14;
  ton(200, 0.3, 'sawtooth', 0.1); setTimeout(() => ton(120, 0.4, 'sawtooth', 0.1), 150);
  const neuerRekord = punkte > rekord;
  if (neuerRekord) { rekord = punkte; try { localStorage.setItem('schlange-rekord', rekord); } catch {} }
  document.getElementById('rekord').textContent = rekord;
  setTimeout(() => {
    document.getElementById('endpunkte').textContent = punkte;
    document.getElementById('endtext').textContent = neuerRekord && punkte > 0 ? '🏆 Neuer Rekord!' : 'Rekord: ' + rekord + ' · Länge: ' + schlange.length;
    document.getElementById('ende').hidden = false;
  }, 900);
}

// ---------- Malen ----------
function helle(hex, f) {          // Farbe heller (f>0) oder dunkler (f<0) machen
  const n = parseInt(hex.slice(1), 16);
  const k = v => Math.max(0, Math.min(255, Math.round(f > 0 ? v + (255 - v) * f : v * (1 + f))));
  return 'rgb(' + k(n >> 16) + ',' + k((n >> 8) & 255) + ',' + k(n & 255) + ')';
}

function malEssen(e, jetzt) {
  const px = ox + (e.x + 0.5) * Z, py = oy + (e.y + 0.5) * Z;
  const hops = Math.sin((jetzt - e.geboren) / 220) * Z * 0.1;
  const auftauchen = Math.min(1, (jetzt - e.geboren) / 250);
  let s = Z * 1.05 * auftauchen;
  if (e.bis) {                                         // Bonus blinkt kurz vor dem Verschwinden
    const rest = e.bis - jetzt;
    if (rest < 2000 && Math.floor(jetzt / 120) % 2) return;
    s *= 1 + Math.sin(jetzt / 120) * 0.06;
    ctx.fillStyle = '#FFE58A55'; ctx.beginPath(); ctx.arc(px, py, Z * 0.75, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#0003'; ctx.beginPath(); ctx.ellipse(px, py + Z * 0.32, Z * 0.32, Z * 0.12, 0, 0, 7); ctx.fill();
  const img = bildCache[e.art];
  if (img) ctx.drawImage(img, px - s / 2, py - s / 2 - Z * 0.1 - hops, s, s);
  else { ctx.font = Math.round(s * 0.8) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e.art, px, py - Z * 0.08 - hops); }
}

function malSchlange(t) {
  const [hell, mittel, dunkel] = FARBEN[einst.farbe];
  // Position jedes Stücks zwischen altem und neuem Kästchen (macht die Bewegung weich)
  const pos = schlange.map((s, i) => {
    const a = vorher[i] || s;
    if (Math.abs(a.x - s.x) > 1 || Math.abs(a.y - s.y) > 1) return { x: s.x, y: s.y };   // durch die Wand: springen
    return { x: a.x + (s.x - a.x) * t, y: a.y + (s.y - a.y) * t };
  });
  // Zwischenstücke einfügen, damit der Körper eine durchgehende Röhre ist
  const teile = [];
  for (let i = pos.length - 1; i >= 0; i--) {
    teile.push({ ...pos[i], i });
    if (i > 0 && Math.abs(pos[i].x - pos[i - 1].x) <= 1.01 && Math.abs(pos[i].y - pos[i - 1].y) <= 1.01)
      teile.push({ x: (pos[i].x + pos[i - 1].x) / 2, y: (pos[i].y + pos[i - 1].y) / 2, i: i - 0.5 });
  }
  const n = pos.length;
  const breite = i => Z * (0.86 - 0.3 * (i / Math.max(n, 6)));   // zum Schwanz hin dünner
  const tiefe = Z * 0.22;
  // 1. Schatten auf dem Rasen
  ctx.fillStyle = '#0000002e';
  for (const p of teile) { const b = breite(p.i); ctx.beginPath(); ctx.ellipse(ox + (p.x + 0.5) * Z + Z * 0.08, oy + (p.y + 0.5) * Z + tiefe + Z * 0.06, b * 0.5, b * 0.42, 0, 0, 7); ctx.fill(); }
  // 2. dunkle Seitenwand (das ist das „3D“)
  ctx.fillStyle = dunkel;
  for (const p of teile) { const b = breite(p.i); rund(ctx, ox + (p.x + 0.5) * Z - b / 2, oy + (p.y + 0.5) * Z - b / 2 + tiefe * 0.2, b, b + tiefe * 0.8, b * 0.32); ctx.fill(); }
  // 3. Oberseite mit Streifen und Glanz
  for (const p of teile) {
    const b = breite(p.i), cx = ox + (p.x + 0.5) * Z, cy = oy + (p.y + 0.5) * Z - tiefe * 0.2;
    const g = ctx.createLinearGradient(cx - b / 2, cy - b / 2, cx + b / 2, cy + b / 2);
    const streifen = Math.floor(p.i) % 3 === 0;
    g.addColorStop(0, helle(streifen ? mittel : hell, 0.25)); g.addColorStop(1, streifen ? dunkel : mittel);
    ctx.fillStyle = g; rund(ctx, cx - b / 2, cy - b / 2, b, b, b * 0.32); ctx.fill();
  }
  for (const p of teile) {          // Glanzpunkt oben links
    if (p.i % 1) continue;
    const b = breite(p.i), cx = ox + (p.x + 0.5) * Z, cy = oy + (p.y + 0.5) * Z - tiefe * 0.2;
    ctx.fillStyle = '#ffffff55'; rund(ctx, cx - b * 0.34, cy - b * 0.36, b * 0.32, b * 0.18, b * 0.09); ctx.fill();
  }
  malKopf(pos[0], hell, mittel, dunkel, tiefe);
}

function malKopf(p, hell, mittel, dunkel, tiefe) {
  const s = Z * 1.0, cx = ox + (p.x + 0.5) * Z, cy = oy + (p.y + 0.5) * Z - tiefe * 0.25;
  const jetzt = performance.now();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.atan2(richtung.y, richtung.x));
  // Zunge: schnellt ab und zu heraus
  if (!tot && Math.floor(jetzt / 700) % 3 === 0) {
    const l = s * (0.25 + 0.15 * Math.sin(jetzt / 40));
    ctx.strokeStyle = '#E8344A'; ctx.lineWidth = Math.max(2, Z * 0.07); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s * 0.45, 0); ctx.lineTo(s * 0.45 + l, 0);
    ctx.moveTo(s * 0.45 + l, 0); ctx.lineTo(s * 0.45 + l + s * 0.1, -s * 0.08);
    ctx.moveTo(s * 0.45 + l, 0); ctx.lineTo(s * 0.45 + l + s * 0.1, s * 0.08); ctx.stroke();
  }
  // Kopf-Klotz
  ctx.fillStyle = dunkel; rund(ctx, -s / 2, -s / 2 + tiefe * 0.25, s, s, s * 0.34); ctx.fill();
  const g = ctx.createLinearGradient(0, -s / 2, 0, s / 2);
  g.addColorStop(0, helle(hell, 0.3)); g.addColorStop(1, mittel);
  ctx.fillStyle = g; rund(ctx, -s / 2, -s / 2, s, s, s * 0.34); ctx.fill();
  ctx.fillStyle = '#ffffff50'; rund(ctx, -s * 0.36, -s * 0.42, s * 0.4, s * 0.16, s * 0.08); ctx.fill();
  // Augen (schauen in Laufrichtung)
  for (const seite of [-1, 1]) {
    const ax = s * 0.12, ay = seite * s * 0.22;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ax, ay, s * 0.16, 0, 7); ctx.fill();
    if (tot) {                                                          // x_x
      ctx.strokeStyle = '#222'; ctx.lineWidth = Math.max(2, s * 0.05);
      ctx.beginPath(); ctx.moveTo(ax - s * 0.08, ay - s * 0.08); ctx.lineTo(ax + s * 0.08, ay + s * 0.08);
      ctx.moveTo(ax + s * 0.08, ay - s * 0.08); ctx.lineTo(ax - s * 0.08, ay + s * 0.08); ctx.stroke();
    } else {
      ctx.fillStyle = '#1B1B1B'; ctx.beginPath(); ctx.arc(ax + s * 0.05, ay, s * 0.085, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ax + s * 0.08, ay - s * 0.04, s * 0.03, 0, 7); ctx.fill();
    }
  }
  // Nasenlöcher und rote Bäckchen
  ctx.fillStyle = '#0006';
  for (const seite of [-1, 1]) { ctx.beginPath(); ctx.arc(s * 0.4, seite * s * 0.1, s * 0.03, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#FF7A8A66';
  for (const seite of [-1, 1]) { ctx.beginPath(); ctx.ellipse(-s * 0.08, seite * s * 0.38, s * 0.1, s * 0.06, 0, 0, 7); ctx.fill(); }
  ctx.restore();
}

function malEffekte() {
  for (const f of funken) {
    f.x += f.vx; f.y += f.vy; f.vy += 0.35; f.leben -= 0.03;
    ctx.globalAlpha = Math.max(0, f.leben);
    ctx.fillStyle = f.farbe; ctx.fillRect(f.x - f.g / 2, f.y - f.g / 2, f.g, f.g);
    ctx.fillStyle = '#0003'; ctx.fillRect(f.x - f.g / 2, f.y + f.g * 0.2, f.g, f.g * 0.3);
  }
  funken = funken.filter(f => f.leben > 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texte) {
    t.y -= 1.2; t.leben -= 0.02;
    ctx.globalAlpha = Math.max(0, t.leben);
    ctx.font = '800 ' + Math.round(Z * 0.8) + 'px system-ui';
    ctx.fillStyle = '#0006'; ctx.fillText(t.t, t.x + 2, t.y + 3);
    ctx.fillStyle = '#FFE14D'; ctx.fillText(t.t, t.x, t.y);
  }
  texte = texte.filter(t => t.leben > 0);
  ctx.globalAlpha = 1;
}

function schleife(jetzt) {
  if (laeuft && !pausiert) {
    while (jetzt - letzterSchritt >= takt && laeuft) { letzterSchritt += takt; schritt(); }
    if (bonus && jetzt > bonus.bis) bonus = null;
  } else if (pausiert) letzterSchritt = jetzt;
  const t = laeuft && !pausiert ? Math.min(1, (jetzt - letzterSchritt) / takt) : 1;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (wackeln > 0) { ctx.translate((Math.random() - 0.5) * wackeln, (Math.random() - 0.5) * wackeln); wackeln *= 0.85; if (wackeln < 0.5) wackeln = 0; }
  ctx.drawImage(boden, 0, 0, W, H);
  if (schlange) {
    malEssen(essen, jetzt);
    if (bonus) malEssen(bonus, jetzt);
    malSchlange(t);
  }
  malEffekte();
  if (pausiert) {
    ctx.fillStyle = '#0008'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = '800 48px system-ui'; ctx.textAlign = 'center'; ctx.fillText('⏸ Pause', W / 2, H / 2);
  }
  requestAnimationFrame(schleife);
}

// ---------- Steuerung ----------
function lenke(x, y) {
  if (!laeuft || pausiert) return;
  const letzte = wunsch[wunsch.length - 1] || richtung;
  if ((x === letzte.x && y === letzte.y) || (x === -letzte.x && y === -letzte.y)) return;
  if (wunsch.length < 3) wunsch.push({ x, y });
}
addEventListener('keydown', e => {
  const k = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key];
  if (k) { e.preventDefault(); lenke(...k); }
  if (e.key === ' ' || e.key === 'p') pauseUmschalten();
});
// Wischen: schon während der Finger sich bewegt reagieren (schneller als erst beim Loslassen)
let tx = null, ty = null;
cv.addEventListener('pointerdown', e => { tx = e.clientX; ty = e.clientY; });
cv.addEventListener('pointermove', e => {
  if (tx === null) return;
  const dx = e.clientX - tx, dy = e.clientY - ty;
  if (Math.hypot(dx, dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) lenke(Math.sign(dx), 0); else lenke(0, Math.sign(dy));
  tx = e.clientX; ty = e.clientY;
});
addEventListener('pointerup', () => { tx = ty = null; });

function pauseUmschalten() { if (!laeuft) return; pausiert = !pausiert; document.getElementById('pause').textContent = pausiert ? '▶' : '⏸'; }
document.getElementById('pause').onclick = pauseUmschalten;
document.addEventListener('visibilitychange', () => { if (document.hidden && laeuft && !pausiert) pauseUmschalten(); });
document.getElementById('start').onclick = neuesSpiel;
document.getElementById('nochmal').onclick = neuesSpiel;
document.getElementById('zummenue').onclick = () => { document.getElementById('ende').hidden = true; document.getElementById('menue').hidden = false; };

addEventListener('resize', () => { const lief = laeuft; groesse(); if (lief || tot) { laeuft = false; tot = false; schlange = null; document.getElementById('ende').hidden = true; document.getElementById('menue').hidden = false; } });
groesse();
requestAnimationFrame(schleife);

// Offline-Fähigkeit
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>

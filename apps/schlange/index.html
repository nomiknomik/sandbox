<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schlange">
<meta name="theme-color" content="#14361F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Schlange</title>
<style>
  /* Farben an einer Stelle */
  :root{--bg:#0E2416;--panel:#173A24ee;--text:#F2FFF4;--muted:#A9C9B0;--accent:#2BB673;--gold:#FFC93C}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:radial-gradient(circle at 30% 20%,#1F5A33,var(--bg) 70%);color:var(--text);
       font:18px/1.4 -apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #oben{position:fixed;top:calc(8px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none}
  .pille{background:#0006;border-radius:14px;padding:6px 14px;font-weight:700;font-size:20px;display:flex;gap:6px;align-items:center}
  #portal{position:fixed;top:calc(8px + env(safe-area-inset-top));left:10px;padding:8px 12px;border-radius:12px;background:#0005;color:inherit;text-decoration:none;font-size:15px;z-index:5}
  #pause,#ton{position:fixed;top:calc(8px + env(safe-area-inset-top));padding:6px 12px;border-radius:12px;background:#0005;color:inherit;border:0;font-size:20px;z-index:5}
  #pause{right:10px} #ton{right:64px}
  #version{position:fixed;bottom:calc(2px + env(safe-area-inset-bottom));right:4px;padding:8px;font-size:12px;color:var(--muted);cursor:pointer;z-index:5}
  /* Menü und Spielende */
  .fenster{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0007;z-index:4;padding:16px}
  .fenster[hidden]{display:none}
  .karte{background:var(--panel);border-radius:24px;padding:22px 22px 18px;max-width:420px;width:100%;text-align:center;
         box-shadow:0 10px 0 #0B1F12,0 20px 40px #0008;border:2px solid #ffffff22}
  .karte h1{margin:0 0 4px;font-size:44px;letter-spacing:1px;text-shadow:0 4px 0 #0B1F12}
  .karte h1 img{height:64px;vertical-align:middle}
  #logo{width:100%;max-width:380px;margin:-6px 0 0;filter:drop-shadow(0 6px 0 #0B1F12)}
  .zeile{margin:14px 0 6px;color:var(--muted);font-size:15px}
  .wahl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .wahl button{font:inherit;font-size:16px;padding:8px 12px;border-radius:12px;border:2px solid #ffffff33;background:#0003;color:inherit}
  .wahl button.an{border-color:var(--gold);background:#FFC93C33}
  .farbe{width:46px;height:46px;border-radius:12px!important;padding:0!important}
  .los{font:inherit;font-weight:800;font-size:24px;margin-top:18px;padding:14px 40px;border:0;border-radius:16px;
       background:linear-gradient(#3DDC84,#1E9E58);color:#fff;box-shadow:0 6px 0 #146B3B;text-shadow:0 2px 0 #0004}
  .los:active{transform:translateY(4px);box-shadow:0 2px 0 #146B3B}
  .gross{font-size:56px;font-weight:800;margin:4px 0;color:var(--gold);text-shadow:0 4px 0 #6B4A00}
  #hilfe{font-size:14px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
  <canvas id="feld"></canvas>
  <div id="oben"><div class="pille">🍎 <span id="punkte">0</span></div><div class="pille">🏆 <span id="rekord">0</span></div></div>
  <a id="portal" href="../../">🕹 Alle Spiele</a>
  <button id="ton">🔊</button>
  <button id="pause">⏸</button>
  <div id="version"></div>

  <!-- Startmenü -->
  <div class="fenster" id="menue">
    <div class="karte">
      <h1 id="titel"><span id="titelbild">🐍</span> Schlange</h1>
      <!-- Logo aus ChatGPT; fehlt es, bleibt die Schrift -->
      <img id="logo" src="bilder/logo.webp" alt="Schlange" hidden onload="this.hidden=false;titel.hidden=true">
      <div class="zeile">Farbe der Schlange</div>
      <div class="wahl" id="farben"></div>
      <div class="zeile">Tempo</div>
      <div class="wahl" id="tempos"></div>
      <div class="zeile">Gegner-Schlangen</div>
      <div class="wahl" id="gegner"></div>
      <button class="los" id="start">▶ Los!</button>
      <div id="hilfe">Wischen oder Pfeiltasten. Iss Obst und werde lang! Die größere Schlange frisst die kleinere. Triffst du einen Gegner <b>am Kopf</b>, frisst du ihn immer! <b style="color:#7CFF8A">grüne</b> Zahl = fressbar, <b style="color:#FF8A7C">rote</b> Zahl = Vorsicht!</div>
    </div>
  </div>

  <!-- Spielende -->
  <div class="fenster" id="ende" hidden>
    <div class="karte">
      <div style="font-size:22px" id="endtitel">Autsch! 💥</div>
      <div class="gross" id="endpunkte">0</div>
      <div id="endtext" style="color:var(--muted)"></div>
      <button class="los" id="nochmal">🔁 Nochmal</button><br>
      <button class="los" id="zummenue" style="font-size:18px;padding:10px 24px;background:#0004;box-shadow:none">Menü</button>
    </div>
  </div>

<script>
// Bei jeder Änderung hochzählen (und CACHE in sw.js).
const APP_VERSION = '0.5';
// Version unten rechts antippen = nach Update suchen.
const versionEl = document.getElementById('version');
versionEl.textContent = 'v' + APP_VERSION;
versionEl.onclick = async () => {
  const zeig = (text, ms) => { versionEl.textContent = text; if (ms) setTimeout(() => versionEl.textContent = 'v' + APP_VERSION, ms); };
  zeig('suche Update …');
  try {
    const t = await (await fetch('index.html?u=' + Date.now(), { cache: 'no-store' })).text();
    const neu = (t.match(/APP_VERSION = '([^']+)'/) || [])[1];
    if (!neu || neu === APP_VERSION) return zeig('✓ aktuell (v' + APP_VERSION + ')', 2500);
    zeig('lade v' + neu + ' …');
    const reg = 'serviceWorker' in navigator && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update().catch(() => {});
    await new Promise(r => setTimeout(r, 1200));
    location.replace(location.pathname + '?v=' + encodeURIComponent(neu));
  } catch { zeig('offline – v' + APP_VERSION, 2500); }
};

// ---------- Bilder (kommen später aus ChatGPT, bis dahin Emojis) ----------
// Liegt eine Datei in bilder/, wird sie benutzt – sonst wird das Emoji gemalt.
const BILDER = {
  '🍎': 'apfel', '🍒': 'kirschen', '🍓': 'erdbeere', '🍌': 'banane', '🍉': 'melone',
  '🍇': 'trauben', '🍊': 'orange', '🥕': 'karotte', '🌟': 'goldapfel', '💎': 'diamant', '🐍': 'schlange',
};
const bildCache = {};
for (const [emoji, datei] of Object.entries(BILDER)) {
  const img = new Image();
  img.onload = () => { bildCache[emoji] = img; if (emoji === '🐍') document.getElementById('titelbild').innerHTML = '<img src="' + img.src + '" alt="">'; };
  img.src = 'bilder/' + datei + '.webp';
}

// ---------- Einstellungen (merkt sich das Gerät) ----------
const FARBEN = { gruen: ['#4CD964', '#2E9E45', '#1C6B2E'], blau: ['#4DB8FF', '#2479D6', '#174C8F'],
                 lila: ['#C07CFF', '#8A45D9', '#5A2A96'], gold: ['#FFD54A', '#E0A21A', '#9A6A08'], rot: ['#FF6B5E', '#D93A2F', '#8F1F18'] };
const TEMPOS = { '🐢 Langsam': 190, '🐇 Normal': 140, '🚀 Schnell': 95 };
const GEGNER = { '🐍 3': 3, '🐍 6': 6, '🐍 10': 10 };
let einst = { farbe: 'gruen', tempo: '🐇 Normal', gegner: '🐍 6', ton: true };
try { Object.assign(einst, JSON.parse(localStorage.getItem('schlange-einst') || '{}')); } catch {}
const speichern = () => { try { localStorage.setItem('schlange-einst', JSON.stringify(einst)); } catch {} };
let rekord = 0; try { rekord = +localStorage.getItem('schlange-rekord') || 0; } catch {}
document.getElementById('rekord').textContent = rekord;

function wahlKnoepfe(id, werte, schluessel, malen) {
  const box = document.getElementById(id);
  box.innerHTML = '';
  for (const w of werte) {
    const b = document.createElement('button');
    if (malen) { b.className = 'farbe'; b.style.background = 'linear-gradient(' + FARBEN[w][0] + ',' + FARBEN[w][2] + ')'; }
    else b.textContent = w;
    if (einst[schluessel] === w) b.classList.add('an');
    b.onclick = () => { einst[schluessel] = w; speichern(); wahlKnoepfe(id, werte, schluessel, malen); ton(660, 0.05); };
    box.appendChild(b);
  }
}
wahlKnoepfe('farben', Object.keys(FARBEN), 'farbe', true);
wahlKnoepfe('tempos', Object.keys(TEMPOS), 'tempo');
wahlKnoepfe('gegner', Object.keys(GEGNER), 'gegner');

// ---------- Töne (ganz einfache Piepser, kein Download) ----------
let audio = null;
function ton(freq, dauer, art = 'square', lauter = 0.08) {
  if (!einst.ton) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = art; o.frequency.value = freq;
    g.gain.setValueAtTime(lauter, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dauer);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + dauer);
  } catch {}
}
const tonKnopf = document.getElementById('ton');
tonKnopf.textContent = einst.ton ? '🔊' : '🔇';
tonKnopf.onclick = () => { einst.ton = !einst.ton; speichern(); tonKnopf.textContent = einst.ton ? '🔊' : '🔇'; };

// ---------- Die Welt ----------
// Die Welt ist viel größer als der Bildschirm. Die Kamera folgt deiner Schlange.
// Wer am Rand der Welt rausläuft, kommt auf der anderen Seite wieder rein – es gibt keine Wand.
const WB = 60, WH = 60;                    // Weltgröße in Kästchen (gerade Zahl, damit das Karomuster passt)
const OBST = ['🍎', '🍒', '🍓', '🍌', '🍉', '🍇', '🍊', '🥕'];
const OBST_ANZAHL = 45;
const cv = document.getElementById('feld'), ctx = cv.getContext('2d');
let W, H, DPR, Z, muster;                  // Z = Kästchengröße in Pixeln

const ring = (v, n) => ((v % n) + n) % n;                 // 61 -> 1, -1 -> 59
const abst = (d, n) => ring(d + n / 2, n) - n / 2;         // kürzester Weg über den Rand (-30 … 29)
const feldNr = (x, y) => y * WB + x;

function groesse() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  Z = Math.max(26, Math.floor(Math.min(W, H) / 16));
  // Ein 2x2-Stück Rasen als Muster – damit wird der ganze Boden schnell gemalt
  const m = document.createElement('canvas'); m.width = m.height = 2 * Z * DPR;
  const b = m.getContext('2d'); b.scale(DPR, DPR);
  for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) {
    b.fillStyle = (x + y) % 2 ? '#6CC24C' : '#7BD35A'; b.fillRect(x * Z, y * Z, Z, Z);
    b.fillStyle = '#ffffff1a'; b.fillRect(x * Z, y * Z, Z, Z * 0.12);
    b.fillStyle = '#0000001a'; b.fillRect(x * Z, y * Z + Z * 0.88, Z, Z * 0.12);
  }
  muster = ctx.createPattern(m, 'repeat');
}
function rund(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }

// ---------- Spielzustand ----------
let schlangen = [], ich = null, essen = new Map(), punkte = 0, laeuft = false, pausiert = false, tot = false;
let takt, letzterSchritt, funken = [], texte = [], wackeln = 0, kamera = { x: 0, y: 0 }, bonusUhr = 0;

function neueSchlange(x, y, laenge, farbe, bot) {
  const r = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }][Math.floor(Math.random() * 4)];
  const richtung = bot ? r : { x: 1, y: 0 };
  const koerper = [];
  for (let i = 0; i < laenge; i++) koerper.push({ x: ring(x - richtung.x * i, WB), y: ring(y - richtung.y * i, WH) });
  return { koerper, vorher: koerper.map(s => ({ ...s })), richtung, wunsch: [], farbe, bot, lebt: true, wachsen: 0, geboren: performance.now() };
}

// Gegner an einer freien Stelle, nicht direkt vor deiner Nase
function neuerGegner() {
  const farben = Object.keys(FARBEN).filter(f => f !== einst.farbe);
  let x, y, n = 0;
  do { x = Math.floor(Math.random() * WB); y = Math.floor(Math.random() * WH); }
  while (n++ < 200 && (belegt(x, y) || (ich && Math.abs(abst(x - ich.koerper[0].x, WB)) + Math.abs(abst(y - ich.koerper[0].y, WH)) < 14)));
  const laenge = 3 + Math.floor(Math.random() * Math.max(4, ich ? ich.koerper.length + 4 : 8));
  schlangen.push(neueSchlange(x, y, Math.min(laenge, 40), farben[Math.floor(Math.random() * farben.length)], true));
}

function belegt(x, y) {
  return essen.has(feldNr(x, y)) || schlangen.some(s => s.lebt && s.koerper.some(k => k.x === x && k.y === y));
}
function legeEssen(art, extra) {
  let x, y, n = 0;
  do { x = Math.floor(Math.random() * WB); y = Math.floor(Math.random() * WH); } while (belegt(x, y) && ++n < 500);
  essen.set(feldNr(x, y), { x, y, art, geboren: performance.now(), ...extra });
}
const zufallsObst = () => OBST[Math.floor(Math.random() * OBST.length)];

function neuesSpiel() {
  schlangen = []; essen = new Map(); funken = []; texte = []; ich = null;
  ich = neueSchlange(Math.floor(WB / 2), Math.floor(WH / 2), 3, einst.farbe, false);
  schlangen.push(ich);
  for (let i = 0; i < GEGNER[einst.gegner]; i++) neuerGegner();
  for (let i = 0; i < OBST_ANZAHL; i++) legeEssen(zufallsObst());
  punkte = 0; tot = false; bonusUhr = 0;
  takt = TEMPOS[einst.tempo];
  document.getElementById('punkte').textContent = 0;
  letzterSchritt = performance.now();
  laeuft = true; pausiert = false;
  document.getElementById('menue').hidden = true;
  document.getElementById('ende').hidden = true;
  ton(520, 0.08); setTimeout(() => ton(780, 0.12), 90);
}

// ---------- Computer-Schlangen denken nach ----------
// Für jede der 3 möglichen Richtungen (geradeaus, links, rechts) gibt es Punkte.
// Die Richtung mit den meisten Punkten gewinnt.
function botDenkt(b, wer) {
  const kopf = b.koerper[0], len = b.koerper.length;
  const r = b.richtung;
  const moeglich = [r, { x: r.y, y: -r.x }, { x: -r.y, y: r.x }];
  // Ziel suchen: kleinere Schlange in der Nähe jagen, sonst nächstes Essen
  let ziel = null, zielAbst = 1e9;
  for (const s of schlangen) {
    if (s === b || !s.lebt || s.koerper.length >= len) continue;
    const d = Math.abs(abst(s.koerper[0].x - kopf.x, WB)) + Math.abs(abst(s.koerper[0].y - kopf.y, WH));
    if (d < 8 && d < zielAbst) { ziel = s.koerper[0]; zielAbst = d; }
  }
  if (!ziel) for (const e of essen.values()) {
    const d = Math.abs(abst(e.x - kopf.x, WB)) + Math.abs(abst(e.y - kopf.y, WH)) - (e.bis ? 4 : 0);
    if (d < zielAbst) { ziel = e; zielAbst = d; }
  }
  let beste = r, besteWertung = -1e9;
  for (const m of moeglich) {
    const nx = ring(kopf.x + m.x, WB), ny = ring(kopf.y + m.y, WH);
    let wertung = Math.random() * 3 + (m === r ? 1 : 0);
    const da = wer.get(feldNr(nx, ny));
    if (da === b) wertung -= 1000;                                 // nicht in sich selbst beißen
    else if (da) wertung += da.koerper.length < len ? 40 : -1000;  // kleinere fressen, größere meiden
    for (const s of schlangen) {                                   // Abstand halten von großen Köpfen – und von deinem!
      if (s === b || !s.lebt || (s.koerper.length < len && s !== ich)) continue;
      const d = Math.abs(abst(s.koerper[0].x - nx, WB)) + Math.abs(abst(s.koerper[0].y - ny, WH));
      if (s === ich ? d <= 1 : d <= 2) wertung -= (s === ich ? 30 : (3 - d) * 60);   // vor dir laufen sie nur noch wenig weg
    }
    if (wertung > -500 && platz(nx, ny, wer, Math.min(len + 4, 50)) < Math.min(len + 4, 50)) wertung -= 400;   // Sackgasse?
    if (ziel) wertung -= (Math.abs(abst(ziel.x - nx, WB)) + Math.abs(abst(ziel.y - ny, WH))) * 3;
    if (wertung > besteWertung) { besteWertung = wertung; beste = m; }
  }
  b.richtung = beste;
}

// Wie viel freier Platz ist hinter diesem Feld? (Flutfüllung, hört bei 'genug' auf)
function platz(x, y, wer, genug) {
  const gesehen = new Set([feldNr(x, y)]), liste = [[x, y]];
  while (liste.length && gesehen.size < genug) {
    const [cx, cy] = liste.pop();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = ring(cx + dx, WB), ny = ring(cy + dy, WH), nr = feldNr(nx, ny);
      if (gesehen.has(nr) || wer.has(nr)) continue;
      gesehen.add(nr); liste.push([nx, ny]);
    }
  }
  return gesehen.size;
}

// ---------- Ein Schritt für alle Schlangen ----------
function karte() {           // welches Feld gehört welcher Schlange?
  const wer = new Map();
  for (const s of schlangen) if (s.lebt) for (const k of s.koerper) wer.set(feldNr(k.x, k.y), s);
  return wer;
}

function schritt() {
  if (ich.wunsch.length) {
    const w = ich.wunsch.shift();
    if (w.x !== -ich.richtung.x || w.y !== -ich.richtung.y) ich.richtung = w;
  }
  let wer = karte();
  for (const s of schlangen) if (s.lebt && s.bot) botDenkt(s, wer);
  // Alle bewegen sich gleichzeitig
  for (const s of schlangen) {
    if (!s.lebt) continue;
    s.vorher = s.koerper.map(k => ({ ...k }));
    const k = s.koerper[0];
    s.koerper.unshift({ x: ring(k.x + s.richtung.x, WB), y: ring(k.y + s.richtung.y, WH) });
    if (s.bot && s.koerper.length >= 40) s.wachsen = 0;    // Gegner werden höchstens 40 lang – du kannst größer werden!
    if (s.wachsen > 0) { s.wachsen--; s.vorher.push({ ...s.vorher[s.vorher.length - 1] }); }
    else s.koerper.pop();
  }
  // Essen
  for (const s of schlangen) {
    if (!s.lebt) continue;
    const k = s.koerper[0], nr = feldNr(k.x, k.y), e = essen.get(nr);
    if (!e) continue;
    essen.delete(nr);
    const wert = e.art === '🌟' ? 5 : e.art === '💎' ? 3 : 1;
    s.wachsen += e.art === '🌟' ? 3 : 1;
    if (s === ich) gewinn(wert, e, wert > 1 ? '#FFD54A' : '#FF5A4A');
    if (!e.rest) legeEssen(zufallsObst());          // Reste von Schlangen wachsen nicht nach
  }
  // Kopftreffer (Superkraft, nur für dich): Triffst du mit deinem Kopf den Kopf
  // einer Gegnerschlange, frisst du sie – egal wie groß sie ist!
  // Leicht gemacht: Es zählt auch, wenn du die ersten 4 Felder (Kopf + Hals) triffst
  // oder direkt neben dem Kopf landest (auch schräg).
  if (ich.lebt) {
    const k = ich.koerper[0];
    for (const b of schlangen) {
      if (b === ich || !b.lebt) continue;
      const bk = b.koerper[0];
      const nebenKopf = Math.abs(abst(bk.x - k.x, WB)) <= 1 && Math.abs(abst(bk.y - k.y, WH)) <= 1;
      if (nebenKopf || b.koerper.slice(0, 4).some(t => t.x === k.x && t.y === k.y)) { fressen(ich, b, true); break; }
    }
  }
  // Zusammenstöße: Wer größer ist, frisst den anderen!
  for (const a of schlangen) {
    if (!a.lebt) continue;
    const k = a.koerper[0];
    if (a.koerper.slice(1).some(t => t.x === k.x && t.y === k.y)) { zerfallen(a, 'Du hast dich selbst gebissen!'); continue; }
    for (const b of schlangen) {
      if (b === a || !b.lebt) continue;
      if (!b.koerper.some(t => t.x === k.x && t.y === k.y)) continue;
      if (a.koerper.length > b.koerper.length) fressen(a, b);
      else fressen(b, a);
      break;
    }
  }
  schlangen = schlangen.filter(s => s.lebt || s === ich);
  // Bonus taucht ab und zu auf
  if (++bonusUhr > 40) { bonusUhr = 0; legeEssen(Math.random() < 0.6 ? '🌟' : '💎', { bis: performance.now() + 15000 }); }
  for (const [nr, e] of essen) if (performance.now() > (e.bis || e.weg || Infinity)) essen.delete(nr);   // Bonus und Reste verschwinden wieder
  // Neue Gegner kommen nach
  while (schlangen.filter(s => s.bot).length < GEGNER[einst.gegner]) neuerGegner();
  takt = Math.max(70, TEMPOS[einst.tempo] - ich.koerper.length * 0.6);   // je länger, desto schneller
}

function fressen(gross, klein, kopftreffer) {
  klein.lebt = false;
  gross.wachsen += klein.koerper.length;
  const k = klein.koerper[0];
  spritzer(k.x, k.y, FARBEN[klein.farbe][0], 34);
  if (gross === ich) { gewinn(klein.koerper.length, k, FARBEN[klein.farbe][0]); ton(300, 0.15, 'square', 0.1); setTimeout(() => ton(900, 0.2, 'triangle', 0.12), 100); }
  if (kopftreffer) { texte.push({ x: k.x + 0.5, y: k.y - 0.6, t: '💥 KOPFTREFFER!', leben: 1.4 }); wackeln = 8; spritzer(k.x, k.y, '#FFE14D', 30); }
  if (klein === ich) ende('Eine größere Schlange hat dich gefressen!');
}
// Ohne Fresser zerfällt die Schlange zu Obst
function zerfallen(s, grund) {
  s.lebt = false;
  s.koerper.forEach((k, i) => { if (i % 2 === 0 && !essen.has(feldNr(k.x, k.y))) essen.set(feldNr(k.x, k.y), { x: k.x, y: k.y, art: zufallsObst(), geboren: performance.now(), rest: true, weg: performance.now() + 25000 }); });
  spritzer(s.koerper[0].x, s.koerper[0].y, FARBEN[s.farbe][0], 20);
  if (s === ich) ende(grund);
}

function spritzer(x, y, farbe, n) {           // kleine Würfel fliegen weg (in Kästchen-Einheiten)
  for (let i = 0; i < n; i++) {
    const w = Math.random() * Math.PI * 2, v = 0.05 + Math.random() * 0.1;
    funken.push({ x: x + 0.5, y: y + 0.5, vx: Math.cos(w) * v, vy: Math.sin(w) * v - 0.08, leben: 1, farbe: i % 3 ? farbe : '#fff', g: 0.12 + Math.random() * 0.12 });
  }
}
function gewinn(n, wo, farbe) {
  punkte += n;
  document.getElementById('punkte').textContent = punkte;
  spritzer(wo.x, wo.y, farbe, 18);
  texte.push({ x: wo.x + 0.5, y: wo.y + 0.5, t: '+' + n, leben: 1 });
  if (n > 1) { ton(880, 0.1, 'triangle', 0.12); setTimeout(() => ton(1320, 0.15, 'triangle', 0.12), 80); }
  else ton(600 + Math.min(punkte, 40) * 10, 0.07);
}

function ende(grund) {
  laeuft = false; tot = true; wackeln = 14;
  ton(200, 0.3, 'sawtooth', 0.1); setTimeout(() => ton(120, 0.4, 'sawtooth', 0.1), 150);
  const neuerRekord = punkte > rekord;
  if (neuerRekord) { rekord = punkte; try { localStorage.setItem('schlange-rekord', rekord); } catch {} }
  document.getElementById('rekord').textContent = rekord;
  setTimeout(() => {
    document.getElementById('endtitel').textContent = grund.includes('gefressen') ? 'Gefressen! 😱' : 'Autsch! 💥';
    document.getElementById('endpunkte').textContent = punkte;
    document.getElementById('endtext').textContent = grund + (neuerRekord && punkte > 0 ? ' 🏆 Neuer Rekord!' : ' Rekord: ' + rekord);
    document.getElementById('ende').hidden = false;
  }, 1000);
}

// ---------- Malen ----------
// Welt-Kästchen -> Bildschirm-Pixel (die Kamera steht in der Mitte)
const sx = wx => W / 2 + abst(wx - kamera.x, WB) * Z;
const sy = wy => H / 2 + abst(wy - kamera.y, WH) * Z;
const sichtbar = (px, py, rand) => px > -rand && px < W + rand && py > -rand && py < H + rand;

function helle(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const k = v => Math.max(0, Math.min(255, Math.round(f > 0 ? v + (255 - v) * f : v * (1 + f))));
  return 'rgb(' + k(n >> 16) + ',' + k((n >> 8) & 255) + ',' + k(n & 255) + ')';
}

function malBoden() {
  const versX = ring(W / 2 - kamera.x * Z, 2 * Z), versY = ring(H / 2 - kamera.y * Z, 2 * Z);
  ctx.save(); ctx.translate(versX, versY); ctx.fillStyle = muster; ctx.fillRect(-versX, -versY, W, H); ctx.restore();
  // Grashalme und Blumen an festen Stellen der Welt
  const x0 = Math.floor(kamera.x - W / 2 / Z) - 1, y0 = Math.floor(kamera.y - H / 2 / Z) - 1;
  for (let y = y0; y < y0 + H / Z + 3; y++) for (let x = x0; x < x0 + W / Z + 3; x++) {
    const gx = ring(x, WB), gy = ring(y, WH), h = (gx * 7 + gy * 13) % 11;
    if (h !== 0 && h !== 5) continue;
    const px = sx(gx), py = sy(gy);
    if (h === 0) { ctx.fillStyle = '#4FA83A'; for (let i = 0; i < 3; i++) ctx.fillRect(px + Z * (0.3 + i * 0.15), py + Z * (0.45 - (i % 2) * 0.1), Z * 0.07, Z * 0.25); }
    else if ((gx + gy) % 3 === 0) { ctx.fillStyle = ['#FFF', '#FFD84A', '#FF8AC8'][gx % 3]; ctx.beginPath(); ctx.arc(px + Z * 0.5, py + Z * 0.5, Z * 0.07, 0, 7); ctx.fill(); }
  }
}

function malEssen(e, jetzt) {
  const px = sx(e.x + 0.5), py = sy(e.y + 0.5);
  if (!sichtbar(px, py, Z)) return;
  const hops = Math.sin((jetzt - e.geboren) / 220 + e.x) * Z * 0.1;
  let s = Z * (e.rest ? 0.8 : 1.05) * Math.min(1, (jetzt - e.geboren) / 250);
  if (e.bis) {
    if (e.bis - jetzt < 3000 && Math.floor(jetzt / 120) % 2) return;
    s *= 1.15 + Math.sin(jetzt / 120) * 0.06;
    ctx.fillStyle = '#FFE58A55'; ctx.beginPath(); ctx.arc(px, py, Z * 0.8, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#0003'; ctx.beginPath(); ctx.ellipse(px, py + Z * 0.32, Z * 0.32, Z * 0.12, 0, 0, 7); ctx.fill();
  const img = bildCache[e.art];
  if (img) ctx.drawImage(img, px - s / 2, py - s / 2 - Z * 0.1 - hops, s, s);
  else { ctx.font = Math.round(s * 0.8) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e.art, px, py - Z * 0.08 - hops); }
}

// Position jedes Stücks zwischen altem und neuem Kästchen (macht die Bewegung weich)
function positionen(s, t) {
  return s.koerper.map((k, i) => {
    const a = s.vorher[i] || k;
    return { x: a.x + abst(k.x - a.x, WB) * t, y: a.y + abst(k.y - a.y, WH) * t };
  });
}

function malSchlange(s, t) {
  const [hell, mittel, dunkel] = FARBEN[s.farbe];
  const pos = positionen(s, t), n = pos.length;
  // Zwischenstücke einfügen, damit der Körper eine durchgehende Röhre ist
  const teile = [];
  for (let i = n - 1; i >= 0; i--) {
    const px = sx(pos[i].x + 0.5), py = sy(pos[i].y + 0.5);
    teile.push({ px, py, i });
    if (i > 0) teile.push({ px: px + abst(pos[i - 1].x - pos[i].x, WB) * Z / 2, py: py + abst(pos[i - 1].y - pos[i].y, WH) * Z / 2, i: i - 0.5 });
  }
  const dick = 1 + Math.min(n, 40) / 100;                              // große Schlangen sind dicker
  const breite = i => Z * dick * (0.86 - 0.3 * (i / Math.max(n, 6)));
  const tiefe = Z * 0.22;
  const sicht = teile.filter(p => sichtbar(p.px, p.py, Z * 2));
  ctx.fillStyle = '#0000002e';
  for (const p of sicht) { const b = breite(p.i); ctx.beginPath(); ctx.ellipse(p.px + Z * 0.08, p.py + tiefe + Z * 0.06, b * 0.5, b * 0.42, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = dunkel;
  for (const p of sicht) { const b = breite(p.i); rund(ctx, p.px - b / 2, p.py - b / 2 + tiefe * 0.2, b, b + tiefe * 0.8, b * 0.32); ctx.fill(); }
  for (const p of sicht) {
    const b = breite(p.i), cy = p.py - tiefe * 0.2;
    const g = ctx.createLinearGradient(p.px - b / 2, cy - b / 2, p.px + b / 2, cy + b / 2);
    const streifen = Math.floor(p.i) % 3 === 0;
    g.addColorStop(0, helle(streifen ? mittel : hell, 0.25)); g.addColorStop(1, streifen ? dunkel : mittel);
    ctx.fillStyle = g; rund(ctx, p.px - b / 2, cy - b / 2, b, b, b * 0.32); ctx.fill();
  }
  ctx.fillStyle = '#ffffff55';
  for (const p of sicht) { if (p.i % 1) continue; const b = breite(p.i); rund(ctx, p.px - b * 0.34, p.py - tiefe * 0.2 - b * 0.36, b * 0.32, b * 0.18, b * 0.09); ctx.fill(); }
  const kx = sx(pos[0].x + 0.5), ky = sy(pos[0].y + 0.5);
  if (sichtbar(kx, ky, Z * 2)) malKopf(s, kx, ky, hell, mittel, dunkel, tiefe, dick);
}

function malKopf(sch, cx, cy, hell, mittel, dunkel, tiefe, dick) {
  const s = Z * dick, jetzt = performance.now(), weg = !sch.lebt;
  cy -= tiefe * 0.25;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.atan2(sch.richtung.y, sch.richtung.x));
  if (!weg && Math.floor((jetzt + sch.geboren) / 700) % 3 === 0) {   // Zunge
    const l = s * (0.25 + 0.15 * Math.sin(jetzt / 40));
    ctx.strokeStyle = '#E8344A'; ctx.lineWidth = Math.max(2, Z * 0.07); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s * 0.45, 0); ctx.lineTo(s * 0.45 + l, 0);
    ctx.moveTo(s * 0.45 + l, 0); ctx.lineTo(s * 0.55 + l, -s * 0.08);
    ctx.moveTo(s * 0.45 + l, 0); ctx.lineTo(s * 0.55 + l, s * 0.08); ctx.stroke();
  }
  ctx.fillStyle = dunkel; rund(ctx, -s / 2, -s / 2 + tiefe * 0.25, s, s, s * 0.34); ctx.fill();
  const g = ctx.createLinearGradient(0, -s / 2, 0, s / 2);
  g.addColorStop(0, helle(hell, 0.3)); g.addColorStop(1, mittel);
  ctx.fillStyle = g; rund(ctx, -s / 2, -s / 2, s, s, s * 0.34); ctx.fill();
  ctx.fillStyle = '#ffffff50'; rund(ctx, -s * 0.36, -s * 0.42, s * 0.4, s * 0.16, s * 0.08); ctx.fill();
  for (const seite of [-1, 1]) {
    const ax = s * 0.12, ay = seite * s * 0.22;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ax, ay, s * 0.16, 0, 7); ctx.fill();
    if (weg) {
      ctx.strokeStyle = '#222'; ctx.lineWidth = Math.max(2, s * 0.05);
      ctx.beginPath(); ctx.moveTo(ax - s * 0.08, ay - s * 0.08); ctx.lineTo(ax + s * 0.08, ay + s * 0.08);
      ctx.moveTo(ax + s * 0.08, ay - s * 0.08); ctx.lineTo(ax - s * 0.08, ay + s * 0.08); ctx.stroke();
    } else {
      ctx.fillStyle = '#1B1B1B'; ctx.beginPath(); ctx.arc(ax + s * 0.05, ay, s * 0.085, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ax + s * 0.08, ay - s * 0.04, s * 0.03, 0, 7); ctx.fill();
    }
  }
  if (sch.bot) {                       // Gegner haben böse Augenbrauen
    ctx.strokeStyle = '#1B1B1B'; ctx.lineWidth = Math.max(2, s * 0.06); ctx.lineCap = 'round';
    for (const seite of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 0.0, seite * s * 0.38); ctx.lineTo(s * 0.26, seite * s * 0.14); ctx.stroke(); }
  }
  ctx.fillStyle = '#0006';
  for (const seite of [-1, 1]) { ctx.beginPath(); ctx.arc(s * 0.4, seite * s * 0.1, s * 0.03, 0, 7); ctx.fill(); }
  if (!sch.bot) { ctx.fillStyle = '#FF7A8A66'; for (const seite of [-1, 1]) { ctx.beginPath(); ctx.ellipse(-s * 0.08, seite * s * 0.38, s * 0.1, s * 0.06, 0, 0, 7); ctx.fill(); } }
  ctx.restore();
}

// Zahl über jedem Gegner: grün = kleiner als du (fressbar), rot = größer (Vorsicht!)
function malSchilder(t) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '800 ' + Math.round(Z * 0.45) + 'px system-ui';
  for (const s of schlangen) {
    if (!s.bot || !s.lebt) continue;
    const p = positionen(s, t)[0], px = sx(p.x + 0.5), py = sy(p.y + 0.5) - Z * 0.95;
    if (!sichtbar(px, py, Z)) continue;
    const fressbar = s.koerper.length < ich.koerper.length;
    ctx.fillStyle = fressbar ? '#1E9E58' : '#D93A2F';
    rund(ctx, px - Z * 0.4, py - Z * 0.25, Z * 0.8, Z * 0.5, Z * 0.2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(s.koerper.length, px, py + 1);
  }
}

// Kleine Karte unten links: zeigt die ganze Welt
function malKarte() {
  const g = Math.min(130, W * 0.28), f = g / WB, x0 = 10, y0 = H - g - 30;
  ctx.fillStyle = '#0B2414cc'; rund(ctx, x0 - 4, y0 - 4, g + 8, g + 8, 10); ctx.fill();
  ctx.fillStyle = '#ffffff22'; ctx.fillRect(x0 + (ring(kamera.x - W / 2 / Z, WB)) * f, y0 + ring(kamera.y - H / 2 / Z, WH) * f, Math.min(g, W / Z * f), Math.min(g, H / Z * f));
  for (const s of schlangen) {
    if (!s.lebt) continue;
    ctx.fillStyle = s === ich ? '#fff' : (s.koerper.length < ich.koerper.length ? '#7CFF8A' : '#FF6B5E');
    for (const k of s.koerper) ctx.fillRect(x0 + k.x * f, y0 + k.y * f, Math.max(2, f), Math.max(2, f));
  }
}

function malEffekte() {
  for (const f of funken) {
    f.x += f.vx; f.y += f.vy; f.vy += 0.008; f.leben -= 0.03;
    ctx.globalAlpha = Math.max(0, f.leben);
    const px = sx(f.x), py = sy(f.y), g = f.g * Z;
    ctx.fillStyle = f.farbe; ctx.fillRect(px - g / 2, py - g / 2, g, g);
    ctx.fillStyle = '#0003'; ctx.fillRect(px - g / 2, py + g * 0.2, g, g * 0.3);
  }
  funken = funken.filter(f => f.leben > 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texte) {
    t.y -= 0.03; t.leben -= 0.02;
    ctx.globalAlpha = Math.max(0, t.leben);
    ctx.font = '800 ' + Math.round(Z * 0.8) + 'px system-ui';
    const px = sx(t.x), py = sy(t.y);
    ctx.fillStyle = '#0006'; ctx.fillText(t.t, px + 2, py + 3);
    ctx.fillStyle = '#FFE14D'; ctx.fillText(t.t, px, py);
  }
  texte = texte.filter(t => t.leben > 0);
  ctx.globalAlpha = 1;
}

function schleife(jetzt) {
  if (laeuft && !pausiert) {
    while (jetzt - letzterSchritt >= takt && laeuft) { letzterSchritt += takt; schritt(); }
  } else if (pausiert) letzterSchritt = jetzt;
  const t = laeuft && !pausiert ? Math.min(1, (jetzt - letzterSchritt) / takt) : 1;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (ich) { const k = positionen(ich, t)[0]; kamera = { x: ring(k.x + 0.5, WB), y: ring(k.y + 0.5, WH) }; }
  if (wackeln > 0) { ctx.translate((Math.random() - 0.5) * wackeln, (Math.random() - 0.5) * wackeln); wackeln *= 0.85; if (wackeln < 0.5) wackeln = 0; }
  malBoden();
  for (const e of essen.values()) malEssen(e, jetzt);
  for (const s of schlangen) if (s !== ich) malSchlange(s, t);
  if (ich) malSchlange(ich, t);
  malEffekte();
  if (ich) { malSchilder(t); malKarte(); }
  if (pausiert) {
    ctx.fillStyle = '#0008'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = '800 48px system-ui'; ctx.textAlign = 'center'; ctx.fillText('⏸ Pause', W / 2, H / 2);
  }
  requestAnimationFrame(schleife);
}

// ---------- Steuerung ----------
function lenke(x, y) {
  if (!laeuft || pausiert) return;
  const letzte = ich.wunsch[ich.wunsch.length - 1] || ich.richtung;
  if ((x === letzte.x && y === letzte.y) || (x === -letzte.x && y === -letzte.y)) return;
  if (ich.wunsch.length < 3) ich.wunsch.push({ x, y });
}
addEventListener('keydown', e => {
  const k = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key];
  if (k) { e.preventDefault(); lenke(...k); }
  if (e.key === ' ' || e.key === 'p') pauseUmschalten();
});
// Wischen: schon während der Finger sich bewegt reagieren
let tx = null, ty = null;
cv.addEventListener('pointerdown', e => { tx = e.clientX; ty = e.clientY; });
cv.addEventListener('pointermove', e => {
  if (tx === null) return;
  const dx = e.clientX - tx, dy = e.clientY - ty;
  if (Math.hypot(dx, dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) lenke(Math.sign(dx), 0); else lenke(0, Math.sign(dy));
  tx = e.clientX; ty = e.clientY;
});
addEventListener('pointerup', () => { tx = ty = null; });

function pauseUmschalten() { if (!laeuft) return; pausiert = !pausiert; document.getElementById('pause').textContent = pausiert ? '▶' : '⏸'; }
document.getElementById('pause').onclick = pauseUmschalten;
document.addEventListener('visibilitychange', () => { if (document.hidden && laeuft && !pausiert) pauseUmschalten(); });
document.getElementById('start').onclick = neuesSpiel;
document.getElementById('nochmal').onclick = neuesSpiel;
document.getElementById('zummenue').onclick = () => { document.getElementById('ende').hidden = true; document.getElementById('menue').hidden = false; };

addEventListener('resize', groesse);
groesse();
requestAnimationFrame(schleife);

// Offline-Fähigkeit
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>План дома – Кошки-мышки</title>
<style>
  :root{--bg:#FBF6EE;--text:#2B2118;--muted:#7A6B5C;--accent:#E8833A;--card:#fff;--line:#5A4A3A}
  @media (prefers-color-scheme:dark){:root{--bg:#1B1612;--text:#F3EADF;--muted:#B5A693;--card:#2A221B;--line:#E8DCCB}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:12px 16px 40px}
  h1{margin:4px 0 2px;font-size:24px}
  .sub{color:var(--muted);margin:0 0 12px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tabs button{font:inherit;padding:10px 16px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--text);cursor:pointer}
  .tabs button.an{background:var(--accent);color:#fff}
  .karte{background:var(--card);border-radius:16px;padding:10px;box-shadow:0 2px 10px #0001}
  svg{width:100%;height:auto;display:block;touch-action:manipulation}
  .raum-name{font-size:.42px;font-weight:700;fill:#0008}
  .emoji{font-size:.4px;cursor:pointer}
  #info{min-height:2.6em;margin:10px 2px;color:var(--muted)}
  .legende{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px;color:var(--muted)}
  .legende span{display:inline-flex;align-items:center;gap:6px}
  .kasten{display:inline-block;width:22px;height:10px;border-radius:2px}
  a{color:var(--accent)}
  ul{padding-left:20px}
</style>
</head>
<body>
<h1>🏠 План дома</h1>
<p class="sub">Нажми на значок, чтобы узнать, что это. Что поменять? Скажи папе, и Claude переставит.</p>
<div class="tabs" id="tabs"></div>
<div class="karte"><svg id="plan" viewBox="-0.6 -0.9 15.2 11.7"></svg></div>
<div id="info">Выбери предмет на плане.</div>
<div class="legende">
  <span><i class="kasten" style="background:#5A4A3A"></i>стена</span>
  <span><i class="kasten" style="background:#7EC8E3"></i>окно</span>
  <span><i class="kasten" style="background:#fff;border:1px dashed #999"></i>дверь</span>
  <span><i class="kasten" style="background:#FF8C2B"></i>кошачий ход (люди не пролезут)</span>
  <span><i class="kasten" style="background:repeating-linear-gradient(90deg,#c9b79c 0 3px,#9c8a70 3px 5px)"></i>лестница</span>
  <span><i class="kasten" style="background:#222"></i>дыра в полу (кошачий лаз)</span>
</div>
<h3>Как кошка попадает на другой этаж</h3>
<ul id="wege"></ul>
<p><a href="./">← назад в игру</a></p>

<script type="module">
import { KATALOG, grundflaeche, OEFFNUNG } from './js/katalog.js';

const BODEN = { holz: '#E2BC8A', fliesen: '#DDE3E6', teppich: '#E9C9C9', beton: '#C9C5BE', dielen: '#D8B07A' };
const haus = await (await fetch('level/haus.json')).json();
const svg = document.getElementById('plan');
const info = document.getElementById('info');
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, eltern = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); eltern.appendChild(e); return e; };

// Kurz beschreiben, wie man nach oben/unten kommt
const wege = [
  '🪜 Обычная лестница: подвал ↔ 1 этаж (кладовка), 1 ↔ 2 этаж (прихожая), 2 этаж ↔ чердак (коридор).',
  '🐾 Кошачьи ступеньки на стене гостиной → лаз в спальню (2 этаж).',
  '🐾 Кошачьи ступеньки в детской → лаз прямо в секретную комнату на чердаке.',
  '🚪 Кошачьи дверцы: кухня ↔ кладовка, ванная ↔ детская, спальня ↔ детская, чердак ↔ секретная комната.',
];
document.getElementById('wege').innerHTML = wege.map(w => `<li>${w}</li>`).join('');

function zeichne(etage) {
  svg.innerHTML = '';
  const [W, D] = haus.groesse;
  el('rect', { x: -0.3, y: -0.3, width: W + 0.6, height: D + 0.6, fill: '#9BC77A', rx: 0.2 });
  el('text', { x: W / 2, y: -0.45, 'text-anchor': 'middle', 'font-size': 0.35, fill: 'currentColor' }).textContent = '⬆ север (улица, вход)';

  for (const r of etage.raeume) {
    el('rect', { x: r.x0, y: r.z0, width: r.x1 - r.x0, height: r.z1 - r.z0, fill: BODEN[r.boden] || '#ddd' });
  }
  // Treppen + Löcher (auch die Treppe von unten, die hier ankommt)
  const idx = haus.etagen.indexOf(etage);
  const unten = haus.etagen[idx - 1];
  const treppen = etage.objekte.filter(o => o.typ === 'treppe').map(t => ({ ...t, hoch: true }));
  if (unten) for (const t of unten.objekte.filter(o => o.typ === 'treppe')) treppen.push({ ...t, hoch: false });
  for (const t of treppen) {
    const g = el('g', {});
    const n = 12;
    for (let i = 0; i < n; i++) {
      const f = i / n;
      const x = t.x0 + (t.x1 - t.x0) * f;
      el('rect', { x, y: t.z0, width: (t.x1 - t.x0) / n, height: t.z1 - t.z0, fill: t.hoch ? `hsl(35,30%,${70 - f * 25}%)` : '#2228', stroke: '#7a6a55', 'stroke-width': 0.015 }, g);
    }
    el('text', { x: (t.x0 + t.x1) / 2, y: (t.z0 + t.z1) / 2 + 0.14, 'text-anchor': 'middle', 'font-size': 0.32, fill: '#fff', 'font-weight': 700 }, g).textContent = t.hoch ? 'вверх ➜' : '⬇ лестница снизу';
    g.style.cursor = 'pointer';
    g.onclick = () => info.textContent = t.hoch ? '🪜 Лестница наверх' : '🪜 Сюда приходит лестница снизу';
  }
  for (const l of etage.loecher) {
    const r = el('rect', { x: l.x0, y: l.z0, width: l.x1 - l.x0, height: l.z1 - l.z0, fill: '#222', rx: 0.05 });
    r.style.cursor = 'pointer'; r.onclick = () => info.textContent = '🕳️ ' + (l.info || 'дыра в полу');
  }
  if (unten) for (const l of (unten.loecher || [])) {}  // Löcher gehören zur Etage, in deren Boden sie sind
  const oben = haus.etagen[idx + 1];
  if (oben) for (const l of oben.loecher) {
    el('rect', { x: l.x0, y: l.z0, width: l.x1 - l.x0, height: l.z1 - l.z0, fill: 'none', stroke: '#222', 'stroke-width': 0.04, 'stroke-dasharray': '0.08 0.06' });
  }

  // Objekte
  for (const o of etage.objekte) {
    if (o.typ === 'treppe') continue;
    const k = KATALOG[o.typ] || { name: o.typ, emoji: '❓' };
    const [w, d] = grundflaeche(o);
    const g = el('g', {});
    const klein = w < 0.35 && d < 0.35;
    if (!klein) el('rect', { x: o.x - w / 2, y: o.z - d / 2, width: w, height: d, rx: 0.05,
      fill: o.typ === 'teppich' ? (o.farbe || '#a55') + '99' : '#fff9', stroke: '#6b5a48', 'stroke-width': 0.025 }, g);
    const t = el('text', { x: o.x, y: o.z + 0.14, 'text-anchor': 'middle', class: 'emoji' }, g);
    t.textContent = k.emoji;
    if (o.y) t.setAttribute('font-size', 0.3);
    g.style.cursor = 'pointer';
    g.onclick = () => {
      const was = [k.beweglich && 'можно столкнуть', k.zerbrechlich && 'разбивается 💥', k.kratzbar === 'gut' && 'можно точить когти 😺', k.kratzbar === 'schaden' && 'если поцарапать – бабуля рассердится 😾'].filter(Boolean);
      info.textContent = `${k.emoji} ${k.name}${o.y ? ` (стоит на высоте ${o.y} м)` : ''}${was.length ? ' – ' + was.join(', ') : ''}`;
    };
  }

  // Wände mit Öffnungen
  for (const w of etage.waende) {
    const [ax, az] = w.a, [bx, bz] = w.b;
    const len = Math.hypot(bx - ax, bz - az), ux = (bx - ax) / len, uz = (bz - az) / len;
    const dick = w.aussen ? 0.25 : 0.15;
    const oeff = (w.oeffnungen || []).map(o => ({ ...OEFFNUNG[o.typ], ...o })).sort((a, b) => a.pos - b.pos);
    let s = 0;
    const strich = (s0, s1, farbe, extra = {}) => el('line', { x1: ax + ux * s0, y1: az + uz * s0, x2: ax + ux * s1, y2: az + uz * s1, stroke: farbe, 'stroke-width': dick, 'stroke-linecap': 'butt', ...extra });
    for (const o of oeff) {
      const s0 = o.pos - o.breite / 2, s1 = o.pos + o.breite / 2;
      if (s0 > s) strich(s, s0, '#5A4A3A');
      if (o.typ === 'fenster') strich(s0, s1, '#7EC8E3');
      else if (o.typ === 'klappe') { strich(s0, s1, '#FF8C2B'); }
      else if (o.typ === 'haustuer') strich(s0, s1, '#8B5A2B');
      else strich(s0, s1, '#fff', { 'stroke-dasharray': '0.06 0.05', 'stroke-width': 0.05 });
      s = s1;
    }
    if (s < len) strich(s, len, '#5A4A3A');
  }
  // Raumnamen
  const schon = new Set();
  for (const r of etage.raeume) {
    if (schon.has(r.name)) continue; schon.add(r.name);
    const t = el('text', { x: (r.x0 + r.x1) / 2, y: r.z0 + 0.55, 'text-anchor': 'middle', class: 'raum-name' });
    t.textContent = (r.geheim ? '🤫 ' : '') + r.name;
    if (r.name.length > 12) t.setAttribute('font-size', 0.3);
  }
  // Start
  if (haus.start.etage === etage.id) el('text', { x: haus.start.x, y: haus.start.z - 0.35, 'text-anchor': 'middle', 'font-size': 0.45 }).textContent = '🐱';
}

const tabs = document.getElementById('tabs');
const reihenfolge = [...haus.etagen].reverse();   // чердак сверху, как в настоящем доме
for (const e of reihenfolge) {
  const b = document.createElement('button');
  b.textContent = e.name;
  b.onclick = () => { for (const x of tabs.children) x.classList.toggle('an', x === b); zeichne(e); info.textContent = 'Выбери предмет на плане.'; };
  tabs.appendChild(b);
}
tabs.children[2].click();   // 1 этаж
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="__TITEL__">
<meta name="theme-color" content="__FARBE__">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>__TITEL__</title>
<style>
  /* Farben an einer Stelle – so kann man sie leicht gemeinsam ändern */
  :root{--bg:#F4F7FB;--text:#1B2A3A;--muted:#5B6B7C;--accent:__FARBE__}
  @media (prefers-color-scheme:dark){:root{--bg:#0F1722;--text:#E8EEF5;--muted:#9AAABB}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:18px/1.4 -apple-system,system-ui,sans-serif;
       padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       -webkit-user-select:none;user-select:none;touch-action:manipulation}
  h1{margin:0 0 8px}
  button{font:inherit;padding:14px 28px;border:0;border-radius:14px;background:var(--accent);color:#fff}
  #version{position:fixed;bottom:calc(2px + env(safe-area-inset-bottom));right:4px;padding:8px;font-size:12px;color:var(--muted);cursor:pointer}
</style>
</head>
<body>
  <h1>__TITEL__</h1>
  <p id="text">Hier entsteht etwas Neues.</p>
  <button id="knopf">Drück mich</button>
  <div id="version"></div>

<script>
// Bei jeder Änderung hochzählen (und CACHE in sw.js).
const APP_VERSION = '0.1';
// Version unten rechts antippen = nach Update suchen.
// (iPhone/iPad holen Updates für Home-Bildschirm-Apps sonst nur selten von selbst.)
const versionEl = document.getElementById('version');
versionEl.textContent = 'v' + APP_VERSION;
versionEl.onclick = async () => {
  const zeig = (text, ms) => { versionEl.textContent = text; if (ms) setTimeout(() => versionEl.textContent = 'v' + APP_VERSION, ms); };
  zeig('suche Update …');
  try {
    // ?u=… umgeht auch den Zwischenspeicher von GitHub Pages
    const t = await (await fetch('index.html?u=' + Date.now(), { cache: 'no-store' })).text();
    const neu = (t.match(/APP_VERSION = '([^']+)'/) || [])[1];
    if (!neu || neu === APP_VERSION) return zeig('✓ aktuell (v' + APP_VERSION + ')', 2500);
    zeig('lade v' + neu + ' …');
    const reg = 'serviceWorker' in navigator && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update().catch(() => {});             // neuen Service Worker (neuer CACHE) holen
    await new Promise(r => setTimeout(r, 1200));
    location.replace(location.pathname + '?v=' + encodeURIComponent(neu));
  } catch { zeig('offline – v' + APP_VERSION, 2500); }
};

// --- Ab hier bauen wir gemeinsam ---
let zaehler = 0;
document.getElementById('knopf').onclick = () => {
  zaehler++;
  document.getElementById('text').textContent = 'Gedrückt: ' + zaehler + '×';
};

// Offline-Fähigkeit (funktioniert nur über https oder localhost)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>

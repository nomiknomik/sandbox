<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sandbox</title>
<style>
  :root{--bg:#F4F7FB;--card:#fff;--text:#1B2A3A;--muted:#5B6B7C;--accent:#2E6FD8}
  @media (prefers-color-scheme:dark){:root{--bg:#0F1722;--card:#1A2533;--text:#E8EEF5;--muted:#9AAABB;--accent:#6FA3FF}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,system-ui,sans-serif;
       padding:calc(24px + env(safe-area-inset-top)) 16px 32px}
  main{max-width:640px;margin:0 auto}
  h1{margin:0 0 4px} p{color:var(--muted);margin:0 0 20px}
  ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
  a{display:flex;align-items:center;gap:14px;padding:14px;background:var(--card);border-radius:16px;
    color:inherit;text-decoration:none;box-shadow:0 1px 3px #0001}
  a img{width:52px;height:52px;border-radius:12px}
  .leer{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<main>
  <h1>Sandbox</h1>
  <p>Unsere selbstgebauten Spiele und Apps.</p>
  <ul>
<!-- APPS -->
    <li><a href="apps/morskoj-boj/"><img src="apps/morskoj-boj/icon-192.png" alt="">Морской бой</a></li>
  </ul>
  <p class="leer" id="leer">Noch keine App – los geht's!</p>
</main>
<script>if(document.querySelector('ul li')) document.getElementById('leer').remove();</script>
</body>
</html>

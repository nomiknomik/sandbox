<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spiele">
<meta name="theme-color" content="#151923">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Spieleportal</title>
<style>
  /* Farben wie im Design-Konzept */
  :root{--bg:#151923;--karte:#1D2433;--rand:#2E3A50;--text:#F2F4F7;--muted:#A9B3BF;--orange:#FF7A24;--cyan:#47D7E8;--sand:#D8C49A}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{margin:0;min-height:100vh;color:var(--text);font:17px/1.35 -apple-system,system-ui,sans-serif;
       padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
       background:
         radial-gradient(ellipse at 50% -10%, rgba(255,122,36,.22), transparent 55%),
         radial-gradient(ellipse at 50% 110%, rgba(71,215,232,.14), transparent 55%),
         linear-gradient(rgba(71,215,232,.05) 1px, transparent 1px) 0 0/32px 32px,
         linear-gradient(90deg, rgba(71,215,232,.05) 1px, transparent 1px) 0 0/32px 32px,
         var(--bg);
       -webkit-user-select:none;user-select:none}
  main{max-width:960px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 22px}
  header img{width:64px;height:64px;border-radius:15px;box-shadow:0 6px 18px #0008,0 0 24px rgba(255,122,36,.35)}
  /* Metall-Schrift mit 3D-Kante */
  h1{margin:0;font:900 clamp(30px,8vw,52px)/1 Impact,'Arial Black',sans-serif;letter-spacing:2px;
     background:linear-gradient(180deg,#FFFFFF 0%,#C9D0D6 38%,#7E8790 52%,#B9C1C8 70%,#EEF1F4 100%);
     -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#ddd;
     filter:drop-shadow(0 2px 0 #8a3a10) drop-shadow(0 2px 0 #3a1604) drop-shadow(0 0 14px rgba(255,122,36,.45))}
  header small{display:block;margin-top:6px;font:900 13px/1 Impact,'Arial Black',sans-serif;letter-spacing:5px;color:var(--orange)}

  /* Spiele als große Kacheln */
  ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
  li a{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 12px 16px;border-radius:22px;
       background:linear-gradient(180deg,#232C3F,var(--karte));border:1px solid var(--rand);color:inherit;text-decoration:none;
       font-weight:800;font-size:19px;text-align:center;box-shadow:0 6px 0 #0c0f16,0 10px 24px #0006;transition:transform .12s}
  li a:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 #0c0f16}
  li a img{width:min(120px,30vw);height:min(120px,30vw);border-radius:24%;box-shadow:0 8px 20px #0009;
           outline:2px solid rgba(255,255,255,.08);outline-offset:-2px}
  li a .info{display:block;font-weight:600;font-size:13px;color:var(--muted);margin-top:-4px}
  li a::after{content:'';position:absolute;inset:-1px;border-radius:22px;pointer-events:none;
              box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 2px var(--farbe,transparent);opacity:.55}
  li a .zuletzt{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--orange);color:#fff}
  .leer{color:var(--muted);font-style:italic;text-align:center}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:13px}
  #version{cursor:pointer;padding:6px}
</style>
</head>
<body>
<main>
  <header>
    <img src="icon-192.png" alt="">
    <div><h1>SPIELEPORTAL</h1><small>UNSERE SPIELE</small></div>
  </header>
  <ul>
<!-- APPS -->
    <li><a href="apps/tanchiki/"><img src="apps/tanchiki/icon-192.png" alt="">Танчики</a></li>
    <li><a href="apps/wuermer/"><img src="apps/wuermer/icon-192.png" alt="">Würmer</a></li>
    <li><a href="apps/morskoj-boj/"><img src="apps/morskoj-boj/icon-192.png" alt="">Морской бой</a></li>
  </ul>
  <p class="leer" id="leer">Noch keine App – los geht's!</p>
  <footer>Aus jedem Spiel kommst du mit <b>🕹 Alle Spiele</b> hierher zurück.<br><span id="version"></span></footer>
</main>
<script>
// Bei jeder Änderung am Portal hochzählen (und CACHE in sw.js).
const PORTAL_VERSION = '1.1';

// Kurze Beschreibung und Farbe pro Spiel (neue Spiele ohne Eintrag gehen auch)
const INFO = {
  'apps/tanchiki/': ['Panzer-Action wie früher', '#FF7A24'],
  'apps/wuermer/': ['Würmer-Schlacht', '#5FC24A'],
  'apps/morskoj-boj/': ['Schiffe versenken', '#47D7E8'],
};
const liste = document.querySelectorAll('ul li a');
if (liste.length) document.getElementById('leer').remove();
let zuletzt = null; try { zuletzt = localStorage.getItem('portal-zuletzt'); } catch {}
for (const a of liste) {
  const ziel = a.getAttribute('href'), [text, farbe] = INFO[ziel] || [];
  if (text) a.insertAdjacentHTML('beforeend', '<span class="info">' + text + '</span>');
  if (farbe) a.style.setProperty('--farbe', farbe);
  if (ziel === zuletzt) a.insertAdjacentHTML('beforeend', '<span class="zuletzt">zuletzt</span>');
  a.addEventListener('click', () => { try { localStorage.setItem('portal-zuletzt', ziel); } catch {} });
}

// Version antippen = nach Update suchen (wie in den Spielen)
const v = document.getElementById('version');
v.textContent = 'Portal v' + PORTAL_VERSION;
v.onclick = async () => {
  v.textContent = 'suche Update …';
  try {
    const t = await (await fetch('index.html?u=' + Date.now(), { cache: 'no-store' })).text();
    const neu = (t.match(/PORTAL_VERSION = '([^']+)'/) || [])[1];
    if (!neu || neu === PORTAL_VERSION) { v.textContent = '✓ aktuell (v' + PORTAL_VERSION + ')'; return; }
    const reg = await navigator.serviceWorker.getRegistration('./');
    if (reg) await reg.update().catch(() => {});
    setTimeout(() => location.replace(location.pathname + '?v=' + neu), 1000);
  } catch { v.textContent = 'offline – Portal v' + PORTAL_VERSION; }
};

// Offline: Portal + alle Spiele vorbereiten, damit sie ohne Internet starten
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  for (const a of liste) { const ziel = a.getAttribute('href'); navigator.serviceWorker.register(ziel + 'sw.js', { scope: ziel }).catch(() => {}); }
}
</script>
</body>
</html>
